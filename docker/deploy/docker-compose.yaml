# Triển khai NCS AI (Knight) trên server khác bằng image đã build sẵn (KHÔNG build lại).
# Image được tạo trên máy build bằng update.ps1, đóng gói bằng export-image.ps1, rồi nạp ở đây:
#
#   docker load -i ncs-chatui-<phiên bản>.tar     (đóng gói kèm Terminal: export-image.ps1 -WithTerminal)
#   copy .env.example .env      (điền mật khẩu, khóa API)
#   docker compose up -d
#
# Đổi phiên bản: nạp file .tar mới, đặt OWUI_IMAGE trong .env (vd ncs-chatui:9647ea6d0), chạy lại
# `docker compose up -d`. Dữ liệu nằm trong các volume bên dưới nên giữ nguyên khi đổi image.
# Logo/tên thương hiệu đã nằm sẵn trong image lúc build; BRAND_NAME ở đây chỉ đặt tên hiển thị.

name: ncs-chatui

x-owui-image: &owui-image ${OWUI_IMAGE:-ncs-chatui:latest}

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: owui-postgres
    ports:
      # Chỉ chính server kết nối được (DBeaver/psql trên server, hoặc qua SSH tunnel)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: openwebui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: openwebui
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwebui -d openwebui"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: owui-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    container_name: owui-rustfs
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY}
    ports:
      - "9001:9001"            # giao diện web quản lý file (có thể bỏ)
    volumes:
      - s3data:/data
    restart: unless-stopped

  # Tạo bucket "openwebui" một lần rồi thoát (dùng boto3 có sẵn trong image NCS AI (Knight)).
  bucket-init:
    image: *owui-image
    container_name: owui-bucket-init
    depends_on: [rustfs]
    environment:
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
    entrypoint:
      - python
      - -c
      - |
        import os, time, boto3
        s3 = boto3.client('s3', endpoint_url='http://rustfs:9000', region_name='us-east-1',
                          aws_access_key_id=os.environ['S3_ACCESS_KEY_ID'],
                          aws_secret_access_key=os.environ['S3_SECRET_ACCESS_KEY'])
        for _ in range(60):
            try:
                names = [b['Name'] for b in s3.list_buckets().get('Buckets', [])]
                if 'openwebui' not in names:
                    s3.create_bucket(Bucket='openwebui')
                print('bucket openwebui OK')
                break
            except Exception as e:
                print('waiting for rustfs:', e)
                time.sleep(2)
        else:
            raise SystemExit(1)
    restart: "no"

  # Máy chạy lệnh cho AI (Open Terminal): tạo file Word/Excel/PowerPoint/PDF, đổi docx -> pdf bằng LibreOffice.
  # Chỉ trong mạng Docker (không mở cổng). Kết nối trong Admin > Cài đặt > Tích hợp > Terminal:
  #   URL http://open-terminal:8000, xác thực Bearer = TERMINAL_API_KEY, ID = ncs-terminal.
  open-terminal:
    # Image nạp từ file .tar (export-image.ps1 -WithTerminal); chỉ tải từ ghcr.io khi server chưa có
    image: ${TERMINAL_IMAGE:-ghcr.io/open-webui/open-terminal:latest}
    pull_policy: missing
    container_name: owui-terminal
    environment:
      - OPEN_TERMINAL_API_KEY=${TERMINAL_API_KEY}
    volumes:
      - terminal-home:/home/user
    restart: unless-stopped

  open-webui:
    image: *owui-image
    container_name: open-webui
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      bucket-init: { condition: service_completed_successfully }
    ports:
      - "${WEBUI_PORT:-8000}:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      # --- Thương hiệu (tên hiển thị trên giao diện, tiêu đề tab, email...) ---
      - WEBUI_NAME=${BRAND_NAME:-NCS AI (Knight)}

      # --- Bảo mật ---
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_SIGNUP=false

      # --- Database và vector DB ---
      - DATABASE_URL=postgresql://openwebui:${POSTGRES_PASSWORD}@postgres:5432/openwebui
      - DATABASE_POOL_SIZE=20
      - VECTOR_DB=pgvector

      # --- Nhiều worker và realtime ---
      - UVICORN_WORKERS=4
      - REDIS_URL=redis://redis:6379/0
      - WEBSOCKET_MANAGER=redis
      - ENABLE_WEBSOCKET_SUPPORT=true

      # --- Lưu file vào RustFS (S3) ---
      - STORAGE_PROVIDER=s3
      - S3_ENDPOINT_URL=http://rustfs:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=openwebui
      - S3_REGION_NAME=us-east-1
      - S3_ADDRESSING_STYLE=path

      # --- LLM trên cloud ---
      - ENABLE_OLLAMA_API=false
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Model của kết nối đầu tiên (OPENAI_API_BASE_URL) tự công khai cho mọi người dùng; admin vẫn đổi quyền được
      - DEFAULT_MODEL_ACCESS=${DEFAULT_MODEL_ACCESS:-public}

      # --- Kiến thức: embedding (chỉ áp dụng lần cài đầu; sau đó sửa trong Admin > Tài liệu) ---
      - BYPASS_EMBEDDING_AND_RETRIEVAL=${BYPASS_EMBEDDING_AND_RETRIEVAL:-false}
      - RAG_EMBEDDING_ENGINE=${RAG_EMBEDDING_ENGINE:-openai}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-BAAI/bge-m3}
      - RAG_OPENAI_API_BASE_URL=${RAG_EMBEDDING_BASE_URL:-}
      - RAG_OPENAI_API_KEY=${RAG_EMBEDDING_API_KEY:-}
      - RAG_EMBEDDING_BATCH_SIZE=${RAG_EMBEDDING_BATCH_SIZE:-32}
      - CHUNK_SIZE=${CHUNK_SIZE:-1200}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-150}
      - RAG_TOP_K=${RAG_TOP_K:-8}
      - ENABLE_RAG_HYBRID_SEARCH=${ENABLE_RAG_HYBRID_SEARCH:-false}
      - RAG_FILE_MAX_SIZE=50

      # --- Đọc file vừa với context 32k ---
      - VIEW_FILE_DEFAULT_MAX_CHARS=12000
      - VIEW_FILE_MAX_CHARS=20000
      - CHAT_RESPONSE_MAX_TOOL_CALL_ITERATIONS=40
      - ENABLE_CONTEXT_COMPACTION=true
      - CONTEXT_COMPACTION_TOKEN_THRESHOLD=20000

      # --- AI khi được @mention trong kênh ---
      - CHANNEL_MODEL_DEFAULT_TIMEZONE=Asia/Ho_Chi_Minh
      - CHANNEL_MODEL_HISTORY_LIMIT=50
      - CHANNEL_MODEL_MAX_FILES=5
      # Terminal cho AI khi được @mention trong kênh (ID kết nối trong Admin > Tích hợp > Terminal; trống = tắt)
      - CHANNEL_MODEL_TERMINAL_ID=${CHANNEL_MODEL_TERMINAL_ID:-}
      # Kết nối Terminal tạo sẵn ở lần chạy đầu (khi database chưa lưu danh sách Terminal nào).
      # Sau khi đã sửa trong Admin > Tích hợp > Terminal thì giá trị trong Admin được dùng, dòng này bị bỏ qua.
      - 'TERMINAL_SERVER_CONNECTIONS=[{"id":"ncs-terminal","name":"NCS Terminal","url":"http://open-terminal:8000","path":"/openapi.json","auth_type":"bearer","key":"${TERMINAL_API_KEY}","enabled":true,"config":{"access_grants":${TERMINAL_ACCESS_GRANTS:-[]}}}]'

      # --- Project tracker: tự tổng hợp tiến độ công việc theo kênh ---
      - ENABLE_PROJECT_TRACKER=true
      - TRACKER_MODEL=${TRACKER_MODEL:-}             # vd: nai hoặc nai,gpt-4o-mini (ưu tiên theo thứ tự); dùng kết nối nào có model này
      - TRACKER_LLM_FAILOVER=${TRACKER_LLM_FAILOVER:-true}   # kết nối lỗi thì tự chuyển sang kết nối tiếp theo
      - TRACKER_MAX_CONCURRENCY=${TRACKER_MAX_CONCURRENCY:-2}
      - TRACKER_TIMEZONE=Asia/Ho_Chi_Minh
      - TRACKER_IDLE_SECONDS=90
      - TRACKER_BATCH_SIZE=30
      # --- Giám sát hiệu năng (trang riêng ở service monitor) ---
      - ENABLE_PERF_MONITOR=${ENABLE_PERF_MONITOR:-true}
      - PERF_RETENTION_DAYS=${PERF_RETENTION_DAYS:-90}
      - MONITOR_API_KEY=${MONITOR_API_KEY:-}
    restart: unless-stopped

  # Trang giám sát hiệu năng: chạy riêng, cùng image, không nằm trong giao diện NCS AI.
  # Mở http://<MONITOR_BIND>:${MONITOR_PORT:-8090}. MONITOR_BIND = IP mạng LAN của server để mở trong LAN,
  # 127.0.0.1 = chỉ trên chính server (mặc định).
  monitor:
    image: *owui-image
    container_name: ncs-monitor
    depends_on:
      postgres: { condition: service_healthy }
    command: ["uvicorn", "open_webui.monitoring.server.app:app", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      - "${MONITOR_BIND:-127.0.0.1}:${MONITOR_PORT:-8090}:8090"
    volumes:
      # Đọc RAM/CPU các container. Bỏ dòng này nếu không muốn cấp quyền Docker cho container giám sát.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DATABASE_URL=postgresql://openwebui:${POSTGRES_PASSWORD}@postgres:5432/openwebui
      - REDIS_URL=redis://redis:6379/0
      - OPEN_WEBUI_URL=http://open-webui:8080
      - MONITOR_API_KEY=${MONITOR_API_KEY:-}
      - MONITOR_USERNAME=${MONITOR_USERNAME:-admin}
      - MONITOR_PASSWORD=${MONITOR_PASSWORD:-}
    restart: unless-stopped


  # Model embedding chạy riêng trên server (tùy chọn). Bật bằng: docker compose --profile embedding up -d
  # Khi bật: RAG_EMBEDDING_BASE_URL=http://embedding:80/v1 (trong .env hoặc Admin > Tài liệu).
  embedding:
    image: ${EMBEDDING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-latest}
    container_name: ncs-embedding
    profiles: ["embedding"]
    command: ["--model-id", "${EMBEDDING_MODEL_ID:-BAAI/bge-m3}", "--max-client-batch-size", "64"]
    volumes:
      - embedding-models:/data
    restart: unless-stopped

volumes:
  embedding-models: {}
  postgres: {}
  s3data: {}
  open-webui: {}
  terminal-home: {}
