    ], d.items, 'Chưa có kênh nào được theo dõi tiến độ.');
    const teamBox = tx.team ? `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
        <div style="display:flex;justify-content:space-between;align-items:center"><b>Kênh ${esc(tx.team.channel || '')}: chủ kênh &amp; người quản lý</b><button class="btn" type="button" data-tx-team-close>Đóng</button></div>
        <p class="muted" style="font-size:12px;margin:4px 0 8px">Người quản lý (team lead) quản lý tiến độ như chủ kênh. Chủ kênh nghỉ việc: chuyển cho thành viên khác, tin nhắn, file, đầu việc giữ nguyên; chủ cũ (nếu còn làm) thành người quản lý.</p>
        ${table([
          { label: 'Thành viên', render: (m) => `${esc(m.name)}<div class="muted" style="font-size:11px">${esc(m.email || '')}</div>` },
          { label: 'Vai trò', render: (m) => [m.is_owner ? '<span class="pill ok">chủ kênh</span>' : '', m.is_manager ? '<span class="pill">quản lý</span>' : '', m.is_admin ? '<span class="pill">admin</span>' : '', m.left ? '<span class="pill err">đã nghỉ</span>' : ''].join(' ') },
          { label: '', render: (m) => (m.is_owner || m.left ? '' : `<button class="btn" type="button" data-tx-owner="${esc(m.id)}" data-tx-name="${esc(m.name)}">Chuyển chủ kênh</button> <button class="btn" type="button" data-tx-manager="${esc(m.id)}" data-tx-on="${m.is_manager ? '0' : '1'}">${m.is_manager ? 'Bỏ quản lý' : 'Đặt làm quản lý'}</button>`) },
        ], tx.team.members || [], 'Kênh chưa có thành viên.')}</div>` : '';
    return card('Kênh dự án', `<p class="muted" style="font-size:12.5px;margin:-4px 0 10px"><b>Tổng hợp lại kênh</b> đọc lại toàn bộ tin nhắn và file của kênh bằng phiên bản hiện tại, thay danh sách việc đang mở bằng kết quả mới (không trùng, không còn việc rác từ các lần đọc cũ). Việc đã đóng hoặc hủy được giữ và không bị tạo lại; lịch sử cập nhật được ghi lại từ đầu. Các chỉnh tay trên việc đang mở sẽ mất. Tin nhắn được đọc lại theo đúng thứ tự, vài tin một lượt, mỗi tin tính theo ngày gửi; trong lúc đọc, người dùng, nhắc việc và báo cáo vẫn dùng bản cũ, đọc xong mới thay một lần. Mỗi lúc chỉ một kênh được tổng hợp lại, các kênh có tin mới được ưu tiên; kênh nhiều tin có thể mất hàng giờ. Chỉ dùng khi thật cần và kiểm tra lại sau khi xong. Cần phiên chỉnh sửa.</p><div style="margin:-2px 0 10px"><button class="btn" type="button" data-tx-rebuild-all title="Tổng hợp lại mọi kênh có tin nhắn trong 30 ngày qua (cần phiên chỉnh sửa)">Tổng hợp lại tất cả kênh đang hoạt động</button></div>${tx.rebuildNote ? `<div class="notice info" style="margin-bottom:8px">${esc(tx.rebuildNote)}</div>` : ''}${rows}${teamBox}<div id="tx-items">${txItemsHtml()}</div>`);
  }

  // Work items of one channel, and the trace of one item: where it comes from and why it exists.
  const TXI_FILTERS = [
    ['open', 'Đang mở', (i) => !i.da_dong && !i.cho_xac_nhan],
    ['unassigned', 'Chưa gán', (i) => !i.da_dong && !i.cho_xac_nhan && (i.chua_giao || !(i.phu_trach || []).length)],
    ['suggested', 'Đề xuất từ yêu cầu', (i) => !i.da_dong && (i.nguon || []).some((s) => s.includes('#yc'))],
    ['waiting', 'Chờ xác nhận (chưa rõ nguồn)', (i) => i.cho_xac_nhan],
    ['file', 'Từ file', (i) => !i.da_dong && (i.nguon_dem.file || i.nguon_dem.dong_bang)],
    ['message', 'Chỉ từ tin nhắn', (i) => !i.da_dong && !i.cho_xac_nhan && !i.nguon_dem.file && !i.nguon_dem.dong_bang],
    ['closed', 'Đã đóng / hủy', (i) => i.da_dong],
  ];
  function txItemsHtml() {
    const v = tx.items;
    if (!v) return '';
    const head = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b>Việc trong kênh ${esc(v.channel || '')}</b><button class="btn" type="button" data-tx-items-close>Đóng</button></div>`;
    const frame = (body) => `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">${head}${body}</div>`;
    if (v.loading) return frame('<span class="spin"></span> Đang tải…');
    if (v.error) return frame(`<div class="error-box">${esc(v.error)}</div>`);
    const all = v.data.items || [];
    const tabs = TXI_FILTERS.map(([key, label, test]) => `<button class="btn${v.filter === key ? ' primary' : ''}" type="button" data-tx-items-filter="${key}">${label} (${all.filter(test).length})</button>`).join(' ');
    const test = (TXI_FILTERS.find(([key]) => key === v.filter) || TXI_FILTERS[0])[2];
    const list = all.filter(test);
    const sourceText = (i) => [i.nguon_dem.dong_bang ? `${i.nguon_dem.dong_bang} dòng bảng` : '', i.nguon_dem.file ? `${i.nguon_dem.file} file` : '', i.nguon_dem.tin_nhan ? `${i.nguon_dem.tin_nhan} tin nhắn` : ''].filter(Boolean).join(' · ') || '<span class="pill warn">không còn nguồn</span>';
    const rowsHtml = table([
      { label: 'Việc', render: (i) => `<b>${esc(i.ten)}</b>${(i.nguon || []).some((s) => s.includes('#yc')) ? ' <span class="pill">đề xuất từ yêu cầu</span>' : ''}${i.cho_xac_nhan ? ` <span class="pill warn">chờ xác nhận · chưa rõ nguồn</span>${(i.phu_trach_doc_duoc || []).length ? `<div class="muted" style="font-size:11px">AI đọc được người phụ trách: ${esc(i.phu_trach_doc_duoc.join(', '))}</div>` : ''}` : ''}${(i.chi_tiet || []).length ? `<ul style="margin:2px 0 0 16px;padding:0;font-size:11.5px" class="muted">${i.chi_tiet.map((d) => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}${i.vuong_mac ? `<div class="muted" style="font-size:11px">vướng: ${esc(i.vuong_mac)}</div>` : ''}` },
      { label: 'Phụ trách', render: (i) => (i.chua_giao || !(i.phu_trach || []).length ? '<span class="pill warn">chưa gán</span>' : esc((i.phu_trach || []).join(', '))) },
      { label: 'Hạn', render: (i) => esc(i.han || '—') },
      { label: 'Trạng thái', render: (i) => `${esc(TX_STATUS[i.trang_thai] || i.trang_thai || '')}${i.tien_do != null ? ` · ${i.tien_do}%` : ''}` },
      { label: 'Nguồn', render: (i) => `<span class="muted" style="font-size:11.5px">${sourceText(i)}</span>` },
      { label: '', render: (i) => `<button class="btn" type="button" data-tx-trace="${esc(i.id)}">${v.trace && v.trace.id === i.id ? 'Đang xem' : 'Truy vết'}</button>` },
    ], list, 'Không có việc nào ở mục này.');
    return frame(`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">${tabs}</div>${rowsHtml}<div id="tx-trace">${txTraceHtml()}</div>`);
  }
  function txTraceHtml() {
    const t = tx.items && tx.items.trace;
    if (!t) return '';
    const frame = (body) => `<div style="margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px">${body}</div>`;
    if (t.loading) return frame('<span class="spin"></span> Đang truy vết…');
    if (t.error) return frame(`<div class="error-box">${esc(t.error)}</div>`);
    const d = t.data;
    const it = d.item || {};
    const section = (title, body) => `<div style="margin-top:10px"><div style="font-weight:600;font-size:12.5px;margin-bottom:4px">${title}</div>${body}</div>`;
    const why = `<ul style="margin:0 0 0 18px;padding:0;font-size:12.5px;line-height:1.55">${(d.why || []).map((w) => `<li>${esc(w)}</li>`).join('')}</ul>`;
    const owners = table([
      { label: 'Tên', render: (o) => `<b>${esc(o.ten)}</b>` },
      { label: 'Cách xác định', render: (o) => `<span style="font-size:12px">${esc(o.trang_thai)}</span>` },
      { label: 'Tài khoản', render: (o) => `<span class="muted" style="font-size:11px">${esc(o.tai_khoan || '')}</span>` },
    ], d.owners || [], 'Chưa có người phụ trách.');
    const readings = (d.readings || []).map((r) => {
      const e = r.entry || {};
      const cols = Object.entries(r.columns || {}).filter(([, val]) => val && (!Array.isArray(val) || val.length)).map(([k, val]) => `${esc(k)}=${esc(Array.isArray(val) ? val.join('+') : val)}`).join(' · ');
      return `<div class="notice info" style="margin-bottom:6px;font-size:12.5px"><b>${esc(r.name || '')}</b> · đọc lúc ${when(r.created_at)}${e.khoa ? ` · ${esc(e.khoa.split(':').slice(1).join(':'))}` : ''}${e.dong ? ` · dòng ${esc(e.dong)}` : ''}${e.trang ? ` · trang ${esc(e.trang)}` : ''}
        <div style="margin-top:4px">Kết quả đọc: <b>${esc(e.ten || '')}</b> — ${esc((e.phu_trach || []).join(', ') || 'chưa giao')} — hạn ${esc(e.han || '—')} — ${esc(TX_STATUS[e.trang_thai] || e.trang_thai || '')}</div>
        <div class="muted" style="margin-top:4px">Câu gốc trong file: ${esc(e.trich_dan || '—')}</div>
        ${cols ? `<div class="muted" style="margin-top:4px;font-size:11px">Cột dùng: ${cols}</div>` : ''}</div>`;
    }).join('') || '<span class="muted" style="font-size:12px">Không đến từ file.</span>';
    const messages = (d.messages || []).map((m) => (m.con
      ? `<div style="border-left:3px solid var(--blue);padding:4px 8px;margin-bottom:6px;font-size:12.5px"><b>${esc(m.user_name || '?')}</b> <span class="muted">${when(m.created_at)}${m.parent_id ? ' · trả lời trong luồng' : ''}</span>${m.files ? `<div class="muted" style="font-size:11px">file: ${esc(m.files)}</div>` : ''}<div style="white-space:pre-wrap;margin-top:2px">${esc(m.content || '')}</div></div>`
      : `<div style="border-left:3px solid var(--red);padding:4px 8px;margin-bottom:6px;font-size:12.5px"><span class="pill err">đã xóa</span> <span class="muted">${esc(m.id)}</span></div>`)).join('') || '<span class="muted" style="font-size:12px">Không có tin nhắn nguồn.</span>';
    const files = (d.files || []).map((f) => `${f.con ? '' : '<span class="pill err">không còn</span> '}${esc(f.ten || f.id)}`).join(', ');
    const history = table([
      { label: 'Lúc', render: (h) => when(h.created_at) },
      { label: 'Lượt tổng hợp ghi', render: (h) => `<span style="font-size:12px">${esc(h.summary || '')}</span>${(h.removed || []).length ? `<div class="muted" style="font-size:11px">gỡ: ${esc(h.removed.join('; '))}</div>` : ''}` },
    ], d.history || [], 'Không có lượt tổng hợp nào ghi nhận.');
    return frame(`<div style="display:flex;justify-content:space-between;align-items:center"><b>Truy vết: ${esc(it.ten || '')}</b><button class="btn" type="button" data-tx-trace-close>Đóng</button></div>
      <div class="muted" style="font-size:11.5px;margin-top:2px">mã ${esc(it.id || '')} · nguồn: ${esc((it.nguon || []).join(', ') || '—')}</div>
      ${section('Vì sao có việc này', why)}
      ${section('Người phụ trách được xác định thế nào', owners)}
      ${section('Đọc từ file', `${readings}${files ? `<div class="muted" style="font-size:11.5px">File nguồn: ${files}</div>` : ''}`)}
      ${section('Tin nhắn nguồn', messages)}
      ${section('Các lượt tổng hợp đã đọc tin nguồn', history)}`);
  }
  function drawTxItems() { const box = document.getElementById('tx-items'); if (box) box.innerHTML = txItemsHtml(); }
  function askRevealKey() {
    if (editor.token || fp.key) return true;
    const key = prompt('Danh sách việc chứa nội dung tin nhắn và tài liệu. Nhập khóa truy xuất (hoặc mở phiên Chỉnh sửa cấu hình):');
    if (!key) return false;
    fp.key = key.trim();
    return true;
  }
  async function openChannelItems(id) {
    if (!askRevealKey()) return;
    tx.items = { id, loading: true, filter: 'open' }; drawTxItems();
    try { const data = await api(`${fpBase()}/tracker/channels/${encodeURIComponent(id)}/items`, { headers: fpHeaders() }); tx.items = { id, data, channel: data.channel, filter: 'open' }; }
    catch (err) { if (!editor.token) fp.key = ''; tx.items = { id, error: err.message }; }
    drawTxItems();
    document.getElementById('tx-items')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  async function openTrace(itemId) {
    if (!tx.items || !askRevealKey()) return;
    tx.items.trace = { id: itemId, loading: true }; drawTxItems();
    try { tx.items.trace = { id: itemId, data: await api(`${fpBase()}/tracker/channels/${encodeURIComponent(tx.items.id)}/items/${encodeURIComponent(itemId)}/trace`, { headers: fpHeaders() }) }; }
    catch (err) { if (!editor.token) fp.key = ''; tx.items.trace = { id: itemId, error: err.message }; }
    drawTxItems();
    document.getElementById('tx-trace')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Work items the tracker read from files: what was extracted, what may be missing, conflicts, table descriptions.
  const tx = { view: null, note: '', editing: '', draft: '', rebuildNote: '', team: null, items: null };
  const TX_STATUS = { chua_bat_dau: 'Chưa bắt đầu', dang_lam: 'Đang làm', bi_chan: 'Bị chặn', tam_dung: 'Tạm dừng', hoan_thanh: 'Hoàn thành' };
  const TX_FIELD = { han: 'Hạn', phu_trach: 'Phụ trách', trang_thai: 'Trạng thái', trong_file: 'Dòng trong file' };
  async function trackerFilesHtml() {
    let d;
    try { d = await api(`/api/tracker/extractions?range=${range === '24h' || range === '1h' ? '7d' : range}`); }
    catch (err) { return card('Đầu việc trích từ file', `<div class="error-box">${esc(err.message)}</div>`); }
    const kindLabel = (r) => { const rep = r.report || {}; if (r.kind === 'table') return rep.mode === 'whole' ? 'Bảng (model đọc cả file)' : rep.mode === 'parts' ? 'Bảng (model đọc theo phần)' : rep.mode === 'spec' ? 'Bảng (theo bản mô tả, bản cũ)' : 'Bảng (không có việc)'; if ((r.report || {}).loai === 'tham_khao') return 'Tài liệu tham khảo (không trích việc)'; return r.kind === 'image' ? 'Ảnh (chép chữ bằng vision)' : 'Văn bản'; };
    // Quality of one extraction: every point placed, nothing invented in owners or deadlines.
    const quality = (r) => {
      const rep = r.report || {};
      const sp = rep.split;
      if (sp && sp.rows) {
        // The model reads the file as it is and reviews its reading; code only checks facts and rows left unread.
        const parts = [`${n(sp.rows)} dòng → ${n(sp.tasks)} việc${sp.gaps ? ` + <b>${n(sp.gaps)} đề xuất từ yêu cầu</b>` : ''}`];
        if (sp.not_tasks) parts.push(`${n(sp.not_tasks)} dòng không phải việc`);
        if (sp.sheets_skipped && Object.keys(sp.sheets_skipped).length) parts.push(`sheet không đọc: ${esc(Object.keys(sp.sheets_skipped).join(', '))}`);
        if (sp.calls) parts.push(`${n(sp.calls)} lượt gọi model`);
        if (sp.retried) parts.push(`đọc lại ${n(sp.retried)} dòng model chưa nhắc tới`);
        if (sp.reviewed) parts.push(`rà lại: sửa chi tiết ${n(sp.details_changed || 0)} việc, bỏ ${n(sp.gaps_removed || 0)} đề xuất, khôi phục ${n(sp.rows_restored || 0)} dòng`);
        const bad = [
          sp.unread ? `<span class="pill warn">${n(sp.unread)} dòng chưa đọc được</span>` : '',
          sp.owners_rejected ? `${n(sp.owners_rejected)} người không có trong dòng bị loại` : '',
          sp.due_rejected ? `${n(sp.due_rejected)} hạn không có trong dòng bị loại` : '',
          sp.progress_rejected ? `${n(sp.progress_rejected)} % không có trong dòng bị loại` : '',
        ].filter(Boolean);
        return `<span class="muted" style="font-size:11.5px">${parts.join(' · ')}${bad.length ? `<br><span style="color:var(--amber, #b45309)">${bad.join(' · ')}</span>` : ''}</span>`;
      }
      if (r.kind === 'table') return `<span class="muted" style="font-size:11.5px">${esc((rep.issues || []).join('; ') || (rep.notes || []).slice(-1).join(''))}</span>`;
      if (rep.loai === 'tham_khao') return `<span class="muted" style="font-size:11.5px">${esc(rep.ly_do || 'Model xếp là tài liệu tham khảo')}</span>`;
      const rej = rep.rejected || {};
      const removed = [rej.phu_trach ? `${n(rej.phu_trach)} người` : '', rej.han ? `${n(rej.han)} hạn` : '', rej.tien_do ? `${n(rej.tien_do)} %` : ''].filter(Boolean);
      return `${n(rep.rechecked || 0)} phần đọc lại, thêm ${n(rep.added_by_recheck || 0)} việc${(rep.suspect || []).length ? ` · <span class="pill warn">${rep.suspect.length} phần vẫn nghi thiếu</span>` : ''}${removed.length ? `<div class="muted" style="font-size:11px">loại vì không có trong văn bản: ${removed.join(', ')}</div>` : ''}`;
    };
    const items = table([
      { label: 'Lúc', render: (r) => when(r.created_at) },
      { label: 'File', render: (r) => `<b>${esc(r.name || (r.source_ids || [])[0] || '')}</b><div class="muted" style="font-size:11px">${esc(r.channel || '')}</div>` },
      { label: 'Loại', render: (r) => esc(kindLabel(r)) },
      { label: 'Đầu việc', num: true, render: (r) => n(r.items) },
      { label: 'Chưa kiểm chứng', num: true, render: (r) => (r.unverified ? `<span class="pill warn">${n(r.unverified)}</span>` : '0') },
      { label: 'Chất lượng', render: (r) => quality(r) },
      { label: '', render: (r) => `<button class="btn" type="button" data-tx-open="${esc(r.id)}">Xem</button> <button class="btn" type="button" data-tx-reimport="${esc((r.source_ids || [])[0] || '')}" data-tx-name="${esc(r.name || '')}" title="Đọc lại file ở lần tổng hợp sau (cần phiên chỉnh sửa)">Đọc lại</button>` },
    ], d.items, 'Chưa có file nào được trích đầu việc.');
    const conflicts = d.conflicts.flatMap((r) => (r.entry.conflicts || []).map((c) => ({ ...c, at: r.at, channel: r.channel, file: r.entry.name })));
    const conflictRows = table([
      { label: 'Lúc', render: (r) => when(r.at) },
      { label: 'Kênh / file', render: (r) => `${esc(r.channel || '')}<div class="muted" style="font-size:11px">${esc(r.file || '')}</div>` },
      { label: 'Việc', render: (r) => `<b>${esc(r.ten)}</b>` },
      { label: 'Thay đổi (cũ → mới, đang dùng giá trị mới)', render: (r) => Object.entries(r.thay_doi || {}).map(([k, v]) => `${esc(TX_FIELD[k] || k)}: <s class="muted">${esc(TX_STATUS[v.cu] || v.cu || '—')}</s> → <b>${esc(TX_STATUS[v.moi] || v.moi || '—')}</b>`).join('<br>') },
      { label: 'Nguồn cũ / mới', render: (r) => `<span class="muted" style="font-size:11px">${esc((r.nguon_cu || []).join(', '))}<br>${esc((r.nguon_moi || []).join(', '))}</span>` },
    ], conflicts, 'Không có mâu thuẫn.');
    const specRows = table([
      { label: 'File', render: (r) => `<b>${esc(r.data.file || '')}</b><div class="muted" style="font-size:11px">${esc(r.id.replace('tablespec:', ''))}</div>` },
      { label: 'Sheet / tiêu đề', render: (r) => { const sp = r.data.spec || {}; return `${esc(sp.sheet || '—')} · dòng ${esc(sp.dong_tieu_de || '?')}`; } },
      { label: 'Cột', render: (r) => { const c = (r.data.spec || {}).cot || {}; return `<span class="muted" style="font-size:11.5px">${Object.entries(c).filter(([, v]) => v && (!Array.isArray(v) || v.length)).map(([k, v]) => `${esc(k)}=${esc(Array.isArray(v) ? v.join('+') : v)}`).join(' · ')}</span>`; } },
      { label: 'Nguồn', render: (r) => (r.data.edited ? '<span class="pill ok">đã sửa tay</span>' : '<span class="pill">model</span>') },
      { label: '', render: (r) => `<button class="btn" type="button" data-tx-spec="${esc(r.id.replace('tablespec:', ''))}">Sửa</button>` },
    ], d.specs, 'Chưa có bảng công việc nào được nhập.');
    const editing = tx.editing ? d.specs.find((r) => r.id === `tablespec:${tx.editing}`) : null;
    const editor_ = editing ? `<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">
        <div class="muted" style="font-size:12.5px;margin-bottom:6px">Bản mô tả của <b>${esc(editing.data.file || '')}</b> (JSON). <code>cot</code>: cột theo chữ cái hoặc tên tiêu đề; <code>ten</code> là danh sách cột ghép thành tên việc; <code>trang_thai</code>: giá trị trong file → chua_bat_dau | dang_lam | bi_chan | tam_dung | hoan_thanh. Bản đã sửa tay không bị model thay; lưu xong bấm <b>Đọc lại</b> ở file để áp dụng.</div>
        <textarea id="tx-spec" spellcheck="false" style="width:100%;min-height:260px;font-family:var(--mono, monospace);font-size:12px">${esc(tx.draft || JSON.stringify(editing.data.spec || {}, null, 2))}</textarea>
        <div style="display:flex;gap:6px;margin-top:6px"><button class="btn primary" type="button" data-tx-spec-save="${esc(tx.editing)}">Lưu bản mô tả</button><button class="btn" type="button" data-tx-spec-close>Đóng</button></div></div>` : '';
    return `${card('Đầu việc trích từ file', `
        <p class="muted" style="font-size:12.5px;margin:-4px 0 10px">Tracker đọc hết mọi phần của file (văn bản sạch sau sửa OCR) và trích từng đầu việc kèm câu gốc, trang. Phần mà model đếm được nhiều việc hơn số đã liệt kê được đọc lại lần 2. Việc có câu gốc khớp văn bản được đưa thẳng vào trạng thái dự án; việc chưa khớp chỉ đưa cho model tổng hợp cân nhắc. Bảng Excel: model mô tả bảng một lần, code đọc mọi dòng theo bản mô tả.</p>
        ${tx.note ? `<div class="notice info" style="margin-bottom:8px">${esc(tx.note)}</div>` : ''}
        ${items}<div id="tx-view">${txViewHtml()}</div>`)}
      <div class="cols">
        ${card('Mâu thuẫn khi ghép việc trùng', `<p class="muted" style="font-size:12.5px;margin:-4px 0 10px">Một việc đã có trong dự án xuất hiện lại trong file mới với hạn, người phụ trách hoặc trạng thái khác. Giá trị mới hơn được dùng, cả hai nguồn được giữ để đối chiếu.</p>${conflictRows}`)}
        ${card('Bản mô tả bảng công việc (nhập Excel)', `${specRows}${editor_}`)}
      </div>`;
  }

  function txViewHtml() {
    const v = tx.view;
    if (!v) return '';
    if (v.loading) return '<div style="margin-top:10px"><span class="spin"></span> Đang tải…</div>';
    if (v.error) return `<div class="error-box" style="margin-top:10px">${esc(v.error)}</div>`;
    const data = v.data.data || {};
    const rep = data.report || {};
    const list = table([
      { label: 'Đầu việc', render: (i) => `<b>${esc(i.ten)}</b>${(i.chi_tiet || []).length ? `<ul style="margin:2px 0 0 16px;padding:0;font-size:11.5px" class="muted">${i.chi_tiet.map((d) => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}${i.vuong_mac ? `<div class="muted" style="font-size:11px">vướng: ${esc(i.vuong_mac)}</div>` : ''}` },
      { label: 'Phụ trách', render: (i) => (i.chua_giao ? '<span class="pill warn">chưa giao</span>' : esc((i.phu_trach || []).join(', ') || '—')) },
      { label: 'Hạn', render: (i) => esc(i.han || '—') },
      { label: 'Trạng thái', render: (i) => esc(TX_STATUS[i.trang_thai] || i.trang_thai || '') },
      { label: 'Vị trí', render: (i) => esc([i.trang ? `tr.${i.trang}` : i.dong ? `dòng ${i.dong}` : '', i.khoa ? i.khoa.split(':').slice(2).join(':') : ''].filter(Boolean).join(' · ') || '—') },
      { label: 'Câu gốc', render: (i) => `${i.xac_minh ? '<span class="pill ok">khớp</span>' : '<span class="pill warn">chưa khớp</span>'} <span class="muted" style="font-size:11.5px">${esc(i.trich_dan || '')}</span>` },
    ], data.items || [], 'Không trích được đầu việc nào.');
    const suspect = (rep.suspect || []).map((p) => `phần ${p.part}${p.pages ? ` (${esc(p.pages)})` : ''}: model đếm ${p.expected} việc, mới trích được ${p.items}`).join('; ');
    const tableInfo = data.kind === 'table' ? `<div class="muted" style="font-size:12px;margin-bottom:6px">${esc((rep.notes || []).join(' · '))}${rep.stats ? ` · sheet ${esc(rep.stats.sheet || '')}: ${n(rep.stats.named ?? 0)}/${n(rep.stats.rows ?? 0)} dòng có tên việc, ${n(rep.stats.dates_ok ?? 0)}/${n(rep.stats.dates ?? 0)} ô hạn đọc được` : ''}${(rep.issues || []).length ? ` · <span style="color:var(--red)">${esc(rep.issues.join('; '))}</span>` : ''}</div>` : '';
    return `<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b>${esc(data.name || '')}</b> <button class="btn" type="button" data-tx-close>Đóng</button></div>
      ${tableInfo}${suspect ? `<div class="notice info" style="margin-bottom:8px">Vẫn nghi thiếu sau khi đọc lại: ${suspect}. Mở file ở các trang này để kiểm tra.</div>` : ''}
      ${list}</div>`;
  }

  function drawTxView() { const box = document.getElementById('tx-view'); if (box) box.innerHTML = txViewHtml(); }

  async function openExtraction(id) {
    if (!editor.token && !fp.key) {
      const key = prompt('Đầu việc trích chứa nội dung tài liệu. Nhập khóa truy xuất (hoặc mở phiên Chỉnh sửa cấu hình):');
      if (!key) return;
      fp.key = key.trim();
    }
    tx.view = { loading: true }; drawTxView();
    try { tx.view = { data: await api(`${fpBase()}/tracker/extractions/${encodeURIComponent(id)}`, { headers: fpHeaders() }) }; }
    catch (err) { if (!editor.token) fp.key = ''; tx.view = { error: err.message }; }
    drawTxView();
    document.getElementById('tx-view')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  let probeResult = null;
  let probing = '';  // mode of the measurement in progress; the page auto-refreshes meanwhile
  const probeOut = () => (probing ? '<span class="spin"></span> Đang đo… (có thể mất đến 1–3 phút)' : probeResult ? probeTable(probeResult) : '');
  async function renderSystem() {
    const d = await api('/api/system');
    const st = d.status || {};
    const s = st.settings || {};
    const c = st.container || {};
    const loaded = st.loaded || {};
    const tr = st.tracker || {};
    const conns = st.openai_connections || [];
    const components = [
      ['Model chat (LLM)', conns.map((x) => `<div style="margin-bottom:4px"><b>Kết nối #${x.index}</b> ${x.enabled ? '' : '<span class="pill">tắt</span>'} <span class="muted">${esc(x.url)}</span><br>${(x.models || x.model_ids || []).length ? (x.models || x.model_ids).map((m) => `<span class="chip">${esc(m)}</span>`).join('') : '<span class="muted">chưa lấy được danh sách model</span>'}</div>`).join('') || 'Chưa có kết nối', 'Cloud / RunPod', null],
      ['Model tác vụ nền (tiêu đề, gợi ý)', esc(s['task.model.external'] || s['task.model.default'] || 'giống model đang chat'), 'theo kết nối', null],
      ['Tracker tiến độ', `${tr.enabled ? 'Bật' : 'Tắt'} · model ưu tiên: ${esc(tr.model || 'tự chọn')} · ${d.tracker_last ? `lần gần nhất dùng <b>${esc(d.tracker_last.model_id)}</b> qua ${esc(d.tracker_last.name)} (${esc(d.tracker_last.url || '')}) lúc ${when(d.tracker_last.ts)}` : 'chưa có lần gọi nào được ghi lại'}${tr.failover ? ' · tự chuyển kết nối khi lỗi' : ''}`, 'theo kết nối', null],
      ['Embedding (kiến thức)', `${esc(s['rag.embedding_engine'] || 'sentence-transformers')} · ${esc(s['rag.embedding_model'] || '—')}${s['rag.bypass_embedding_and_retrieval'] ? ' · <span class="pill warn">không dùng (đang bỏ qua)</span>' : ''}`, s['rag.embedding_engine'] ? 'API' : 'Local (CPU, trong container NCS AI)', loaded.embedding_model],
      ['Reranker', esc(s['rag.reranking_model'] || 'không dùng'), 'Local', loaded.reranker],
      ['Trích xuất tài liệu', esc(s['rag.content_extraction_engine'] || 'thư viện có sẵn (pypdf, python-docx, unstructured)'), 'Local', null],
      ['Nhận dạng giọng nói (STT)', `${esc(s['audio.stt.engine'] || 'faster-whisper')} · ${esc(s['audio.stt.model'] || s['audio.stt.whisper_model'] || '—')}`, s['audio.stt.engine'] ? 'API' : 'Local (nạp khi dùng lần đầu)', loaded.whisper],
      ['Đọc văn bản (TTS)', s['audio.tts.engine'] ? `${esc(s['audio.tts.engine'])} · ${esc(s['audio.tts.model'] || '')}` : 'Giọng đọc có sẵn của trình duyệt', s['audio.tts.engine'] ? 'API' : 'Trình duyệt người dùng', null],
      ['Tìm kiếm web', s['web.search.enable'] ? esc(s['web.search.engine'] || 'chưa chọn') : 'Tắt', 'API', null],
      ['Tool server (OpenAPI / MCP)', (st.tool_servers || []).map((t) => `${esc(t.name)} <span class="muted">${esc(t.type)} · ${esc(t.url)}</span>${t.enabled ? '' : ' <span class="pill">tắt</span>'}`).join('<br>') || 'Không có', 'Dịch vụ ngoài', null],
      ['Tạo ảnh', s['image_generation.enable'] ? `${esc(s['image_generation.engine'])} · ${esc(s['image_generation.model'] || '')}` : 'Tắt', 'API', null],
      ['Chạy code (Code interpreter)', s['code_interpreter.enable'] ? esc(s['code_interpreter.engine']) : 'Tắt', 'Trình duyệt / Jupyter', null],
      ['Terminal (tạo file Word/Excel/PDF)', (st.terminals || []).map((t) => `${esc(t.name)} (${esc(t.url)}) ${t.enabled ? '' : '· tắt'}`).join('<br>') || 'Chưa cấu hình', 'Container riêng', null],
      ['Cơ sở dữ liệu', esc((st.infra || {}).database || '—'), 'Container postgres', null],
      ['Vector DB', esc((st.infra || {}).vector_db || '—'), 'Trong PostgreSQL (pgvector)', null],
      ['Lưu file', esc((st.infra || {}).storage || '—'), 'Container RustFS', null],
      ['Redis (đồng bộ nhiều worker, websocket)', (st.infra || {}).redis ? 'Bật' : 'Tắt', 'Container redis', null],
    ];
    const docker = d.docker || {};
    const containers = (docker.containers || []).sort((a, b) => b.memory - a.memory);
    const maxMem = Math.max(...containers.map((x) => x.memory), 1);
    const db = d.database || {};
    const redis = d.redis || {};
    return `${st.error ? `<div class="notice warn">Không lấy được trạng thái từ NCS AI: ${esc(st.error)}</div>` : ''}
      <div id="editor">${editorHtml()}</div>
      ${card(`Thành phần đang dùng <button class="btn" type="button" data-open-editor>${editor.open ? 'Đóng chỉnh sửa' : 'Chỉnh sửa cấu hình'}</button>`, table([
        { label: 'Thành phần', render: (r) => `<b>${r[0]}</b>` },
        { label: 'Đang dùng', render: (r) => r[1] },
        { label: 'Chạy ở đâu', render: (r) => `<span class="muted">${r[2]}</span>` },
        { label: 'Nạp RAM', render: (r) => (r[3] === null ? '' : r[3] ? '<span class="pill info">đã nạp</span>' : '<span class="pill">chưa</span>') },
      ], components))}
      <div class="cols">
        ${card('Container: RAM và CPU', docker.available ? table([
          { label: 'Container', render: (r) => `<b>${esc(r.name)}</b><div class="muted">${esc(r.image)}</div>` },
          { label: 'RAM', render: (r) => `<div style="display:flex;gap:8px;align-items:center"><div class="meter" style="flex:1"><div style="width:${(r.memory / maxMem) * 100}%"></div></div><span class="num">${bytes(r.memory)}</span></div>` },
          { label: 'CPU', num: true, render: (r) => `${r.cpu_percent.toLocaleString('vi-VN')}%` },
          { label: 'Trạng thái', render: (r) => `<span class="pill ${r.state === 'running' ? 'ok' : 'err'}">${esc(r.status)}</span>` },
        ], containers) : `<div class="notice warn">${esc(docker.reason || 'Không có dữ liệu Docker')}. Hiện chỉ có số liệu của container NCS AI bên dưới.</div>`, `máy chủ: ${bytes(c.host_memory_total)} RAM, ${n(c.cpu_count)} CPU`)}
        ${card('Container NCS AI', `<dl class="kv">
          <dt>RAM đang dùng</dt><dd>${bytes((c.memory || {}).used)}${(c.memory || {}).limit ? ` / giới hạn ${bytes(c.memory.limit)}` : ''}</dd>
          <dt>Tổng RAM các tiến trình</dt><dd>${bytes(c.rss)} (${n(c.processes)} tiến trình, ${n((st.infra || {}).workers)} worker)</dd>
          <dt>CPU</dt><dd>${c.cpu_percent ?? '—'}% · tải TB ${(c.load_avg || []).map((x) => x.toFixed(2)).join(' / ') || '—'}</dd>
          <dt>RAM trống của máy</dt><dd>${bytes(c.host_memory_available)} / ${bytes(c.host_memory_total)}</dd>
          <dt>PostgreSQL</dt><dd>${bytes(db.size)} · ${n(db.connections)} kết nối · ${n(db.perf_events)} bản ghi giám sát</dd>
          <dt>Redis</dt><dd>${redis.error ? esc(redis.error) : `${bytes(redis.memory)} · ${n(redis.clients)} client · ping ${ms(redis.ping_ms)}`}</dd>
        </dl>
        ${(db.tables || []).length ? `<h2 style="margin-top:12px">Bảng lớn nhất</h2>${bars(db.tables.map((t) => ({ label: `${t.name} (${n(t.rows)} dòng)`, value: t.size })), { format: bytes })}` : ''}`)}
      </div>
      ${card('Đo tốc độ trực tiếp', `<p class="muted" style="margin:0 0 10px">Gọi thử từng thành phần ngay bây giờ: cơ sở dữ liệu, Redis, kho file, model embedding, reranker, trích xuất tài liệu/OCR (chạy một PDF mẫu), và mỗi kết nối model (lấy danh sách model + một câu trả lời ngắn để đo thời gian ra chữ đầu và tốc độ sinh). "Đo tất cả model" thử từng model chat của mọi kết nối. Mỗi lần gọi model tốn khoảng 30–100 token.</p>
        <button class="btn primary" type="button" data-probe="one" ${probing ? 'disabled' : ''}>Đo ngay</button>
        <button class="btn" type="button" data-probe="all" ${probing ? 'disabled' : ''} title="Gọi thử một câu trả lời ngắn với từng model chat của mọi kết nối (tối đa 10 model mỗi kết nối)">Đo tất cả model</button>
        <button class="btn" type="button" data-probe="list" ${probing ? 'disabled' : ''}>Đo nhanh (không gọi model)</button>
        <div id="probe-out" style="margin-top:12px">${probeOut()}</div>`)}`;
  }

  const PROBE_NAMES = { database: 'Cơ sở dữ liệu', redis: 'Redis', storage: 'Kho file', embedding: 'Model embedding', reranker: 'Reranker', extraction: 'Trích xuất tài liệu (OCR)' };
  const speed = (cp) => (cp.error ? `<span style="color:var(--red)">${esc(cp.error)}</span>` : `ra chữ đầu ${ms(cp.ttft_ms)}, xong ${ms(cp.total_ms)}, ${n(cp.output_tokens)} token, <b>${cp.tokens_per_second ?? '—'} token/s</b>`);
  function probeTable(pr) {
    if (pr.error) return `<div class="error-box">${esc(pr.error)}</div>`;
    const rows = Object.entries(pr.results || {}).map(([name, r]) => ({ name, ...r }));
    return table([
      { label: 'Thành phần', render: (r) => `<b>${esc(PROBE_NAMES[r.name] || r.name.replace(/^connection #/, 'Kết nối #'))}</b>` },
      { label: 'Kết quả', render: (r) => (r.ok ? '<span class="pill ok">OK</span>' : `<span class="pill err">Lỗi</span> <span class="muted">${esc(r.error)}</span>`) },
      { label: 'Thời gian', num: true, render: (r) => ms(r.ms) },
      { label: 'Chi tiết', render: (r) => {
        const det = r.detail;
        if (!det || typeof det !== 'object') return `<span class="muted">${esc(det || '')}</span>`;
        if (det.completions) return `danh sách model ${ms(det.models_ms)}${det.completions.map((cp) => `<div><b>${esc(cp.model)}</b>: ${speed(cp)}</div>`).join('') || ' · không có model chat'}`;
        if (det.completion) return `danh sách model ${ms(det.models_ms)} · <b>${esc(det.completion.model)}</b>: ${speed(det.completion)}`;
        if (det.relevant !== undefined) return `<b>${esc(det.model)}</b>: đoạn đúng ${det.relevant} · đoạn không liên quan ${det.irrelevant} · ${det.correct ? '<span class="pill ok">xếp hạng đúng</span>' : '<span class="pill err">xếp hạng sai</span>'}${det.hybrid ? '' : ' · <span class="muted">chưa bật Tìm kiếm kết hợp nên chưa được dùng</span>'}`;
        if (det.engine) return `engine <b>${esc(det.engine === 'default' ? 'Mặc định' : det.engine)}</b> · đọc đúng <b>${det.score}%</b> chữ PDF mẫu · ${n(det.chars)} ký tự`;
        if (det.models) return `danh sách model ${ms(det.models_ms)} · ${esc(det.models.slice(0, 6).join(', '))}`;
        if (det.dimensions) return `vector ${n(det.dimensions)} chiều`;
        return esc(JSON.stringify(det));
      } },
    ], rows);
  }

  // ---------- file pipeline: OCR scores per page, vision repairs ----------
  const FP_STATUS = { queued: ['', 'Chờ xử lý'], running: ['warn', 'Đang xử lý'], done: ['ok', 'Xong'], failed: ['err', 'Lỗi'], skipped: ['', 'Bỏ qua'] };
  const PAGE_STATUS = { ok: ['ok', 'Tốt'], low: ['warn', 'OCR kém'], repaired: ['ok', 'Đã sửa'], unverified: ['warn', 'Chưa chắc'], failed: ['err', 'Sửa lỗi'], checked: ['ok', 'Đã kiểm tra'] };
  const FP_STAGE = { pages: 'Chấm điểm trang', repair: 'Sửa OCR bằng vision', rebuild: 'Ghép văn bản', index: 'Lập chỉ mục', summary: 'Tóm tắt sẵn' };
  const FP_METHOD = { text_layer: 'Lớp chữ PDF', ocr: 'OCR', vision: 'Model vision' };
  const FP_ISSUE = { little_text: 'ít/không có chữ', garbled_chars: 'ký tự rác', unreadable_words: 'nhiều từ sai', merged_words: 'từ dính liền', foreign_script: 'chữ Trung/nước ngoài (OCR bịa)', missing_diacritics: 'mất dấu tiếng Việt' };
  const fp = { status: '', q: '', fileId: '', detail: null, filter: '', key: '', page: null, view: null, note: '', selected: new Set() };
  // A job queued again after an error is waiting for its automatic retry.
  const fpStatusPill = (j) => (j.status === 'queued' && j.last_error
    ? `<span class="pill warn">Chờ thử lại (lỗi lần ${n(j.fail_count || 1)})</span>`
    : `<span class="pill ${(FP_STATUS[j.status] || ['', j.status])[0]}">${(FP_STATUS[j.status] || ['', j.status || 'chưa xử lý'])[1]}</span>`);
  const fpHeaders = () => (editor.token ? editHeaders() : fp.key ? { 'X-Reveal-Key': fp.key } : {});
  const fpBase = () => (editor.token ? '/api/admin' : '/api');
  const score = (v) => (v === null || v === undefined ? '—' : `<b style="color:${v >= 80 ? 'var(--green)' : v >= 60 ? 'var(--amber)' : 'var(--red)'}">${Math.round(v)}</b>`);

  async function renderFiles() {
    if (fp.fileId) return renderFileDetail();
    const d = await api(`/api/files/jobs?range=${range}&status=${encodeURIComponent(fp.status)}&q=${encodeURIComponent(fp.q)}`);
    const c = d.counts || {};
    const chips = [['', 'Tất cả'], ...Object.entries(FP_STATUS).map(([k, [, l]]) => [k, `${l} (${n(c[k] || 0)})`])]
      .map(([k, l]) => `<button class="btn" type="button" data-fp-status="${k}" aria-pressed="${fp.status === k}" style="${fp.status === k ? 'border-color:var(--text)' : ''}">${l}</button>`).join(' ');
    const rows = table([
      { label: 'Thời điểm', render: (r) => when(r.queued_at) },
      { label: 'File', render: (r) => `<b>${esc(r.filename || r.file_id)}</b><div class="muted" style="font-size:11px">${esc(r.user_name || '')} · ${bytes(r.size ? +r.size : null)}</div>` },
      { label: 'Trang', num: true, render: (r) => n(r.total) },
      { label: 'OCR kém', num: true, render: (r) => (r.total ? n((r.low || 0) + (r.unverified || 0) + (r.failed || 0) + (r.repaired || 0)) : '—') },
      { label: 'Đã sửa', num: true, render: (r) => n(r.repaired) },

  async function renderFileDetail() {
    const d = fp.detail && fp.detail.file.id === fp.fileId ? fp.detail : await api(`/api/files/${encodeURIComponent(fp.fileId)}/pages`);
    fp.detail = d;

    const pages = d.pages.filter((p) => !fp.filter || p.status === fp.filter);
    const counts = d.pages.reduce((a, p) => ((a[p.status] = (a[p.status] || 0) + 1), a), {});
    const chips = [['', `Tất cả (${d.pages.length})`], ...Object.entries(PAGE_STATUS).filter(([k]) => counts[k]).map(([k, [cls, l]]) => [k, `<span class="pill ${cls}">${l}</span> ${counts[k]}`])]

      { label: '', render: (p) => `<input type="checkbox" data-fp-select="${p.page}" ${fp.selected.has(p.page) ? 'checked' : ''} aria-label="Chọn trang ${p.page}">` },

      { label: 'Trạng thái', render: (p) => `<span class="pill ${(PAGE_STATUS[p.status] || ['', p.status])[0]}">${(PAGE_STATUS[p.status] || ['', p.status])[1]}</span>` },
      { label: 'Sửa bằng vision', render: (p) => { const r = p.repair; if (!r) return '—'; return `<span class="muted" style="font-size:11.5px">${esc(r.model || '')} · ${r.model_ms !== undefined ? `model ${ms(r.model_ms)}${r.attempts > 1 ? ` (${r.attempts} lần)` : ''}${r.wait_ms >= 1000 ? ` · chờ lượt ${ms(r.wait_ms)}` : ''}` : ms(r.ms)}${r.score_after !== undefined ? ` · ${Math.round(r.score_before || 0)} → ${Math.round(r.score_after)}` : ''}${r.used === false ? ' · <b>không dùng</b> (không tốt hơn)' : ''}${r.error ? ` · <span style="color:var(--red)">${esc(r.error)}</span>` : ''}</span>`; } },
      { label: '', render: (p) => `<button class="btn" type="button" data-fp-page="${p.page}">Xem</button>` },
    ], pages, 'Không có trang nào (file không phải PDF hoặc chưa xử lý).');
    // Counted from the pages themselves: a re-run keeps earlier repairs, so per-run stats would show 0.

  // Review of an unsure page: a person picks the right text after comparing it with the image.

    const checked = t.status === 'checked' ? `<span class="muted" style="font-size:12px">Đã kiểm tra (${esc({ raw: 'dùng chữ OCR gốc', vision: 'dùng chữ vision', current: 'giữ chữ đang dùng', edited: 'sửa tay' }[repair.reviewed_use] || '')}${repair.reviewed_at ? `, ${when(repair.reviewed_at / 1e6)}` : ''}). </span>` : '';

  async function reviewPage(use) {
    if (!(await ensureSession('lưu chữ đã kiểm tra của trang'))) { drawFilePage(); return; }
    const v = fp.view;
    const body = { use };
    if (use === 'edited') { body.text = document.getElementById('fp-edit')?.value || ''; v.draft = body.text; }
    try {
      const r = await api(`/api/admin/files/${encodeURIComponent(fp.fileId)}/pages/${v.data.page}/review`, { method: 'POST', headers: editHeaders(), body: JSON.stringify(body) });
      v.reviewNote = `Đã lưu trang ${v.data.page} (điểm ${Math.round(r.score)}); file đang được ghép lại và lập chỉ mục lại.`;
      v.editing = false; v.data.status = 'checked'; fp.detail = null;
    } catch (err) { v.reviewNote = `Không lưu được: ${err.message}`; }
    drawFilePage();
  }

  function drawFilePage() { const box = document.getElementById('fp-page'); if (box) box.innerHTML = pageHtml(); }

  async function openFilePage(page) {
    if (fp.view?.img) URL.revokeObjectURL(fp.view.img);
    if (!editor.token && !fp.key) { fp.view = { askKey: true, page }; drawFilePage(); return; }
    fp.view = { loading: true, page }; drawFilePage();
    const v = { page };
    try { v.data = await api(`${fpBase()}/files/${encodeURIComponent(fp.fileId)}/pages/${page}/text`, { headers: fpHeaders() }); }
    catch (err) {
      if (!editor.token && /Khóa|khóa|429|401|403/.test(err.message)) { fp.key = ''; fp.view = { askKey: true, page, error: err.message }; }
      else fp.view = { error: err.message, page };
      drawFilePage(); return;
    }
    try {
      const res = await fetch(`${fpBase()}/files/${encodeURIComponent(fp.fileId)}/pages/${page}/image`, { headers: fpHeaders(), credentials: 'same-origin' });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `HTTP ${res.status}`);
      v.img = URL.createObjectURL(await res.blob());
    } catch (err) { v.imgError = err.message; }
    fp.view = v; drawFilePage();
    document.getElementById('fp-page')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // The original upload, saved under its own name. Document content: reveal key or edit session.
  async function downloadFile(id, name) {
    if (!editor.token && !fp.key) {
      const key = prompt('Nhập khóa truy xuất để tải file (hoặc mở phiên Chỉnh sửa cấu hình):');
      if (!key) return;
      fp.key = key.trim();
    }
    try {
      const res = await fetch(`${fpBase()}/files/${encodeURIComponent(id)}/original`, { headers: fpHeaders(), credentials: 'same-origin' });
      if (!res.ok) {
        const detail = (await res.json().catch(() => ({}))).detail || `HTTP ${res.status}`;
        if (!editor.token && [401, 403, 429].includes(res.status)) fp.key = '';
        throw new Error(detail);
      }
      const url = URL.createObjectURL(await res.blob());
      const a = document.createElement('a');
      a.href = url; a.download = name || id;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (err) { fp.note = `Không tải được ${name}: ${err.message}`; load(); }
  }

  async function runPipeline(pages) {
    if (!(await ensureSession('chạy lại xử lý file'))) return;
    const what = pages.length ? `đọc lại ${pages.length} trang đã chọn bằng model vision` : 'chạy lại toàn bộ xử lý (chấm điểm, sửa OCR, lập chỉ mục, tóm tắt)';
    if (!confirm(`Đưa file vào hàng đợi để ${what}?`)) return;
    try { await api(`/api/admin/files/${encodeURIComponent(fp.fileId)}/pipeline`, { method: 'POST', headers: editHeaders(), body: JSON.stringify({ pages }) }); fp.note = 'Đã đưa vào hàng đợi; trang tự cập nhật khi xử lý xong.'; fp.selected.clear(); }
    catch (err) { fp.note = `Không đưa vào hàng đợi được: ${err.message}`; }
    fp.detail = null; load();
  }

    ['telegram.max_running', 'Số câu hỏi trả lời cùng lúc (toàn hệ thống)', 'int'],
    ['telegram.new_chat_hours', 'Tự sang cuộc trò chuyện mới sau (giờ không hỏi)', 'int'],
    ['telegram.answer_minutes', 'Thời gian chờ câu trả lời tối đa (phút)', 'int'],
    ['telegram.blocked_channels', 'Kênh không cho hỏi qua Telegram (ID kênh, cách nhau dấu phẩy)', 'list'],
  ];
  const tgTime = (s) => (s ? when(s * 1000) : '—');

  function tgStatusHtml() {
    const s = tg.status || {};
    const conflict = s.conflict_at && Date.now() / 1000 - s.conflict_at < 3600;
    return `<div class="muted">Đang đọc tin: <b>${s.reading ? 'có' : 'không'}</b> · lần cuối OK: ${tgTime(s.last_ok)}${s.error ? ` · <span style="color:var(--err,#d33)">lỗi ${tgTime(s.error_at)}: ${esc(s.error)}</span>` : ''}</div>
      ${conflict ? '<div class="card" style="border-color:#d97706">Có ứng dụng khác đang đọc tin của bot này (409 Conflict). Mỗi môi trường (server, máy thử, máy dev) phải dùng một bot riêng, nếu không liên kết và câu hỏi rơi sang máy khác.</div>' : ''}`;
  }

  function tgSettingsHtml() {
    const v = tg.settings;
    const field = ([key, label, type]) => {
      if (type === 'bool') return `<label class="row" style="gap:8px"><input type="checkbox" data-tg-key="${key}" ${v[key] ? 'checked' : ''}> ${esc(label)}</label>`;
      if (type === 'secret') return `<label style="display:flex;flex-direction:column;gap:4px">${esc(label)}${v['telegram.bot_token_set'] ? ' · <span class="muted">đã lưu</span>' : ''}<span class="row" style="gap:6px"><input class="btn" type="password" autocomplete="off" data-tg-key="${key}" style="min-width:280px"><button class="btn" type="button" data-tg-test>Kiểm tra bot</button></span><span class="muted" data-tg-test-note>${esc(tg.test)}</span>${v['telegram.bot_username'] ? `<span class="muted">Bot: @${esc(v['telegram.bot_username'])}</span>` : ''}</label>`;
      if (type === 'list') return `<label style="display:flex;flex-direction:column;gap:4px;grid-column:1/-1">${esc(label)}<textarea class="btn" rows="2" data-tg-key="${key}" data-tg-list style="text-align:left">${esc((v[key] || []).join(', '))}</textarea></label>`;
      return `<label style="display:flex;flex-direction:column;gap:4px">${esc(label)}<input class="btn" ${type === 'int' ? 'type="number"' : ''} data-tg-key="${key}" value="${esc(v[key] ?? '')}"></label>`;
    };
    return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px">${TG_SETTINGS.map(field).join('')}</div>
      <div class="muted" style="margin-top:8px">Quyền hỏi AI theo nhóm: NCS AI → Trang Quản trị → Nhóm → Quyền mặc định / một nhóm → Quyền Tính năng → Telegram (mặc định bật). Liên kết nhóm Telegram đang tạm tắt.</div>
      <div class="row" style="margin-top:12px;gap:8px"><button class="btn primary" type="button" data-tg-save>Lưu cài đặt Telegram</button><button class="btn" type="button" data-tg-close>Đóng</button></div>
      <h4 style="margin:16px 0 6px">Tài khoản Telegram đã liên kết (${tg.accounts.length})</h4>
      ${table([
        { label: 'Người dùng', render: (a) => `<b>${esc(a.user_name || '')}</b><div class="muted">${esc(a.user_email || '')}</div>` },
        { label: 'Telegram', render: (a) => esc(a.username ? '@' + a.username : a.display_name || a.telegram_user_id) },
        { label: 'Liên kết lúc', render: (a) => rpTime(a.linked_at) },
        { label: 'Dùng lần cuối', render: (a) => rpTime(a.last_seen_at) },
        { label: '', render: (a) => `<button class="btn" type="button" data-tg-unlink="${esc(a.user_id)}">Gỡ liên kết</button>` },
      ], tg.accounts, 'Chưa ai liên kết Telegram.')}`;
  }

  async function tgClick(b) {
    if (b.dataset.tgOpen !== undefined) {
      if (!(await ensureSession('xem cài đặt bot Telegram'))) return true;
      try {
        tg.settings = await api('/api/admin/telegram/settings', { headers: editHeaders() });
        tg.accounts = (await api('/api/admin/telegram/accounts', { headers: editHeaders() })).items || [];
      } catch (err) { tg.note = err.message; }
      load(); return true;
    }
    if (b.dataset.tgClose !== undefined) { tg.settings = null; tg.test = ''; load(); return true; }
    if (b.dataset.tgTest !== undefined) {
      if (!(await ensureSession('kiểm tra bot Telegram'))) return true;
      const token = document.querySelector('[data-tg-key="telegram.bot_token"]')?.value || '';
      try { const r = await api('/api/admin/telegram/test', { method: 'POST', headers: editHeaders(), body: JSON.stringify({ token }) }); tg.test = r.ok ? `Kết nối được bot @${r.username}` : `Lỗi: ${r.error}`; }
      catch (err) { tg.test = `Lỗi: ${err.message}`; }
      const note = document.querySelector('[data-tg-test-note]'); if (note) note.textContent = tg.test;
      return true;
    }
    if (b.dataset.tgSave !== undefined) {
      if (!(await ensureSession('lưu cài đặt bot Telegram'))) return true;
      const changes = {};
      document.querySelectorAll('[data-tg-key]').forEach((el) => {
        const key = el.dataset.tgKey;
        changes[key] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.dataset.tgList !== undefined ? el.value.split(/[,;\s]+/).filter(Boolean) : el.value;
      });
      try { tg.settings = await api('/api/admin/telegram/settings', { method: 'POST', headers: editHeaders(), body: JSON.stringify({ changes }) }); tg.note = 'Đã lưu cài đặt bot Telegram.'; }
      catch (err) { tg.note = `Không lưu được: ${err.message}`; }
      load(); return true;
    }
    if (b.dataset.tgUnlink) {
      if (!(await ensureSession('gỡ liên kết Telegram'))) return true;
      const a = tg.accounts.find((x) => x.user_id === b.dataset.tgUnlink);
      if (!confirm(`Gỡ liên kết Telegram của ${a?.user_name || a?.user_email || 'người này'}?`)) return true;
      try {
        await api(`/api/admin/telegram/accounts/${encodeURIComponent(b.dataset.tgUnlink)}`, { method: 'DELETE', headers: editHeaders() });
        tg.accounts = tg.accounts.filter((x) => x.user_id !== b.dataset.tgUnlink);
        tg.note = 'Đã gỡ liên kết.';
      } catch (err) { tg.note = `Lỗi: ${err.message}`; }
      load(); return true;
    }
    return false;
  }

      <label class="row" style="gap:8px"><input type="checkbox" data-rp-f="enabled" ${r.enabled ? 'checked' : ''}> Đang bật</label>
