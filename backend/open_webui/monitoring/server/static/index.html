      <div style="display:flex;flex-direction:column;gap:4px">Ngày trong tuần (hằng tuần / tùy chỉnh)<div class="row" style="gap:4px;flex-wrap:wrap">${days}</div></div>
      <label class="row" style="gap:8px"><input type="checkbox" data-rp-f="workdays_only" ${c.workdays_only ? 'checked' : ''}> Hằng ngày: chỉ T2–T6</label>
      <label style="display:flex;flex-direction:column;gap:4px">Ngày trong tháng (hằng tháng)<select class="btn" data-rp-f="month_day">${opt(c.month_day, [...Array.from({ length: 28 }, (_, i) => [i + 1, String(i + 1)]), [-1, 'Ngày cuối tháng']])}</select></label>
      <label style="display:flex;flex-direction:column;gap:4px">Khoảng thời gian<select class="btn" data-rp-f="period">${opt(c.period, [['since_last', 'Từ lần gửi trước'], ['7d', '7 ngày gần nhất'], ['last_month', 'Tháng trước']])}</select></label>
      <label class="row" style="gap:8px"><input type="checkbox" data-rp-f="skip_unchanged" ${c.skip_unchanged ? 'checked' : ''}> Bỏ qua kỳ không có thay đổi</label>
      <div>Kênh: ${c.scope === 'pick' ? (r.channel_names || []).map((x) => `<span class="chip">#${esc(x)}</span>`).join('') : '<span class="chip">Tất cả kênh của người tạo</span>'}<div class="muted" style="font-size:12px">Người tạo đổi kênh trong trang Báo cáo định kỳ.</div></div>
      <label class="row" style="gap:8px"><input type="checkbox" data-rp-f="email_enabled" ${c.email?.enabled ? 'checked' : ''}> Gửi email</label>
      <label class="row" style="gap:8px"><input type="checkbox" data-rp-f="email_self" ${c.email?.self ? 'checked' : ''}> Gửi cho người tạo (${esc(r.owner?.email || '')})</label>
      <label style="display:flex;flex-direction:column;gap:4px">Người nhận email khác (cách nhau dấu phẩy)<input class="btn" data-rp-f="email_to" value="${esc((c.email?.to || []).join(', '))}"></label>
      <label class="row" style="gap:8px"><input type="checkbox" data-rp-f="telegram_enabled" ${c.telegram?.enabled ? 'checked' : ''}> Gửi Telegram: ${(r.telegram_chats || []).map((x) => esc(x.title)).join(', ') || '<span class="muted">chưa liên kết chat</span>'}</label>
      <label style="display:flex;flex-direction:column;gap:4px;grid-column:1/-1">Yêu cầu riêng cho AI (trống = mẫu mặc định)<textarea class="btn" rows="3" data-rp-f="prompt" style="text-align:left">${esc(c.prompt || '')}</textarea></label>
    </div>
    <div class="row" style="margin-top:12px;gap:8px"><button class="btn primary" type="button" data-rp-save="${esc(r.id)}">Lưu</button><button class="btn" type="button" data-rp-close>Đóng</button></div>`;
  }

  async function renderReports() {
    const [schedules, queue, tgStatus] = await Promise.all([api('/api/reports/schedules'), api('/api/reports/queue').catch(() => ({ items: [] })), api('/api/telegram/status').catch(() => null)]);
    tg.status = tgStatus;
    rp.items = schedules.items || [];
    const jobs = queue.items || [];
    const waiting = jobs.filter((j) => ['queued', 'writing', 'ready', 'sending'].includes(j.status));
    const editing = rp.items.find((r) => r.id === rp.edit);
    const via = (c) => [c.email?.enabled ? `Email${c.email.self ? ' (người tạo)' : ''}${(c.email.to || []).length ? ` +${c.email.to.length}` : ''}` : '', c.telegram?.enabled ? 'Telegram' : ''].filter(Boolean).join(', ');
    return `${rp.note ? `<div class="card">${esc(rp.note)}</div>` : ''}
      ${card(`Cài đặt báo cáo định kỳ ${rp.settings ? '' : '<button class="btn" type="button" data-rp-settings>Mở cài đặt</button>'}`, rp.settings ? rpSettingsHtml() : '<div class="muted">Quyền tạo báo cáo, gửi qua email, giới hạn và mẫu báo cáo mặc định. Cần xác thực để xem và sửa.</div>')}
      ${tg.note ? `<div class="card">${esc(tg.note)}</div>` : ''}
      ${card(`Bot Telegram ${tg.settings ? '' : '<button class="btn" type="button" data-tg-open>Mở cài đặt</button>'}`, tgStatusHtml() + (tg.settings ? tgSettingsHtml() : '<div class="muted">Một bot dùng chung cho báo cáo định kỳ và hỏi đáp AI: token, bật tắt tính năng, giới hạn, kênh bị chặn, người đã liên kết. Cần xác thực để xem và sửa.</div>'), 'báo cáo + hỏi đáp AI')}
      ${editing ? card(`Sửa: ${esc(editing.name)} <small>của ${esc(editing.owner?.name || '')}</small>`, rpEditHtml(editing)) : ''}
      ${card(`Tất cả lịch báo cáo (${rp.items.length})`, table([
        { label: 'Báo cáo', render: (r) => `<b>${esc(r.name)}</b>${r.enabled ? '' : ' <span class="pill">tạm dừng</span>'}` },
        { label: 'Người tạo', render: (r) => esc(r.owner?.name || '—') },
        { label: 'Lịch', render: (r) => esc(r.when) },
        { label: 'Kênh', render: (r) => (r.config?.scope === 'pick' ? esc((r.channel_names || []).map((x) => '#' + x).join(', ')) : 'Tất cả kênh của người tạo') },
        { label: 'Gửi qua', render: (r) => esc(via(r.config || {})) },
        { label: 'Lần tới', render: (r) => (r.enabled ? rpTime(r.next_run_at) : '—') },
        { label: 'Lần gửi gần nhất', render: (r) => { const [cls, label] = RP_STATUS[r.last_status] || ['', '—']; return `${rpTime(r.last_run_at)} ${r.last_status ? `<span class="pill ${cls}" title="${esc(r.last_error || '')}">${label}</span>` : ''}${r.last_error ? `<div class="muted" style="max-width:320px;overflow-wrap:anywhere">${esc(r.last_error)}</div>` : ''}`; } },
        { label: '', render: (r) => `<span class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn" type="button" data-rp-run="${esc(r.id)}">Gửi ngay</button><button class="btn" type="button" data-rp-edit="${esc(r.id)}">Sửa</button><button class="btn" type="button" data-rp-toggle="${esc(r.id)}">${r.enabled ? 'Tạm dừng' : 'Bật lại'}</button><button class="btn" type="button" data-rp-delete="${esc(r.id)}">Xóa</button></span>` },
      ], rp.items, 'Chưa có lịch báo cáo nào.'), 'người dùng tạo ở trang Báo cáo định kỳ trong NCS AI')}
      ${card(`Hàng đợi gửi (${waiting.length} chưa gửi)`, table([
        { label: 'Báo cáo', render: (j) => `<b>${esc(j.name)}</b>` },
        { label: 'Giờ gửi', render: (j) => rpTime(j.run_at) },
        { label: 'Trạng thái', render: (j) => { const [cls, label] = RP_JOB[j.status] || ['', j.status]; return `<span class="pill ${cls}">${label}</span>${j.attempts > 1 ? ` <span class="muted">lần ${j.attempts}</span>` : ''}`; } },
        { label: 'Ghi chú', render: (j) => `<div style="max-width:420px;overflow-wrap:anywhere">${esc(j.note || '')}</div>` },
        { label: 'Nhận xét AI', render: (j) => (j.has_comment ? `<span title="${esc(j.comment || '')}">có (${rpTime(j.written_at)})</span>` : '<span class="muted">chưa</span>') },
        { label: 'Kết quả', render: (j) => (j.result ? `${(j.result.sent || []).length} nơi nhận${(j.result.errors || []).length ? ` · <span title="${esc((j.result.errors || []).join('; '))}">${j.result.errors.length} lỗi</span>` : ''}` : '—') },
      ], jobs, 'Hàng đợi trống.'), 'báo cáo được đưa vào trước giờ gửi, AI viết nhận xét khi LLM rảnh; số liệu tính lại lúc gửi')}`;
  }

  async function rpClick(b) {
    const id = b.dataset.rpRun || b.dataset.rpEdit || b.dataset.rpToggle || b.dataset.rpDelete || b.dataset.rpSave;
    if (b.dataset.rpSettings !== undefined) {
      if (!(await ensureSession('xem cài đặt báo cáo định kỳ'))) return true;
      try { rp.settings = await api('/api/admin/reports/settings', { headers: editHeaders() }); } catch (err) { rp.note = err.message; }
      load(); return true;
    }
    if (b.dataset.rpSettingsClose !== undefined) { rp.settings = null; rp.telegram = ''; load(); return true; }
    if (b.dataset.rpTgTest !== undefined) {
      if (!(await ensureSession('kiểm tra bot Telegram'))) return true;
      const token = document.querySelector('[data-rp-key="reports.telegram.bot_token"]')?.value || '';
      try { const r = await api('/api/admin/reports/telegram/test', { method: 'POST', headers: editHeaders(), body: JSON.stringify({ token }) }); rp.telegram = r.ok ? `Kết nối được bot @${r.username}` : `Lỗi: ${r.error}`; }
      catch (err) { rp.telegram = `Lỗi: ${err.message}`; }
      const el = b.parentElement.parentElement; const m = el.querySelector('.muted') || el.appendChild(document.createElement('span')); m.className = 'muted'; m.textContent = rp.telegram;
      return true;
    }
    if (b.dataset.rpSettingsSave !== undefined) {
      if (!(await ensureSession('lưu cài đặt báo cáo định kỳ'))) return true;
      const changes = {};
      document.querySelectorAll('[data-rp-key]').forEach((el) => { const key = el.dataset.rpKey; changes[key] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value; });
      try { rp.settings = await api('/api/admin/reports/settings', { method: 'POST', headers: editHeaders(), body: JSON.stringify({ changes }) }); rp.note = 'Đã lưu cài đặt báo cáo định kỳ.'; }
      catch (err) { rp.note = `Không lưu được: ${err.message}`; }
      load(); return true;
    }
    if (b.dataset.rpClose !== undefined) { rp.edit = null; load(); return true; }
    if (!id) return false;
    if (!(await ensureSession('quản lý báo cáo định kỳ'))) return true;
    const item = rp.items.find((r) => r.id === id);
    try {
      if (b.dataset.rpEdit) { rp.edit = id; rp.note = ''; }
      else if (b.dataset.rpToggle) { await api(`/api/admin/reports/schedules/${encodeURIComponent(id)}`, { method: 'PUT', headers: editHeaders(), body: JSON.stringify({ enabled: !item?.enabled }) }); }
      else if (b.dataset.rpDelete) { if (!confirm(`Xóa lịch báo cáo "${item?.name}"? Sẽ không gửi nữa.`)) return true; await api(`/api/admin/reports/schedules/${encodeURIComponent(id)}`, { method: 'DELETE', headers: editHeaders() }); }
      else if (b.dataset.rpRun) {
        b.disabled = true; b.textContent = 'Đang gửi…';
        const r = await api(`/api/admin/reports/schedules/${encodeURIComponent(id)}/run`, { method: 'POST', headers: editHeaders() });
        rp.note = `${item?.name}: ${r.status === 'sent' ? 'đã gửi' : r.status}${(r.sent || []).length ? ` tới ${r.sent.join(', ')}` : ''}${(r.errors || []).length ? ` · lỗi: ${r.errors.join('; ')}` : ''}`;
      } else if (b.dataset.rpSave) {
        const f = (name) => document.querySelector(`[data-rp-f="${name}"]`);
        const config = {
          frequency: f('frequency').value,
          times: f('times').value.split(/[,;\s]+/).filter(Boolean),
          weekdays: [...document.querySelectorAll('[data-rp-day]')].filter((x) => x.checked).map((x) => +x.dataset.rpDay),
          workdays_only: f('workdays_only').checked,
          month_day: +f('month_day').value,
          period: f('period').value,
          skip_unchanged: f('skip_unchanged').checked,
          prompt: f('prompt').value,
          email: { ...(item?.config?.email || {}), enabled: f('email_enabled').checked, self: f('email_self').checked, to: f('email_to').value.split(/[,;\s]+/).filter(Boolean) },
          telegram: { ...(item?.config?.telegram || {}), enabled: f('telegram_enabled').checked },
        };
        await api(`/api/admin/reports/schedules/${encodeURIComponent(id)}`, { method: 'PUT', headers: editHeaders(), body: JSON.stringify({ name: f('name').value, enabled: f('enabled').checked, config }) });
        rp.edit = null; rp.note = `Đã lưu "${f('name').value}".`;
      }
    } catch (err) { rp.note = `Lỗi: ${err.message}`; }
    load(); return true;
  }

  // ---------- terminal (one terminal per user, terminal broker) ----------
  const tm = { egress: null, hours: 24, note: '' };
  const TM_EVENT = {
    created: 'Tạo terminal', evicted: 'Nhường chỗ (dừng terminal rảnh lâu nhất)', busy: 'Hết chỗ, báo bận',
    idle_stop: 'Dừng vì rảnh', expired: 'Xóa vì lâu không dùng', oom: 'Tiến trình vượt RAM', over_quota: 'Vượt dung lượng',
    quota_refused: 'Từ chối lệnh vì vượt dung lượng', start_failed: 'Không khởi động được', stopped_by_admin: 'Admin dừng',
    removed_by_admin: 'Admin xóa',
  };
  const tmIdle = (s) => (s < 60 ? `${s} giây` : s < 3600 ? `${Math.round(s / 60)} phút` : s < 86400 ? `${Math.round(s / 3600)} giờ` : `${Math.round(s / 86400)} ngày`);
  const TM_BAD = ['oom', 'busy', 'over_quota', 'quota_refused', 'start_failed'];

  function tmEgressHtml(eg) {
    const alerts = (eg.alerts || []).length
      ? `<div class="card error-box" style="margin-bottom:10px"><b>Cảnh báo tải lên nhiều:</b> ${eg.alerts.map((a) => `${esc(a.user_name)} ${n(a.up_mb)} MB lúc ${when(a.hour_start * 1000)}`).join(' · ')}</div>`
      : '';
    return alerts + table([
      { label: 'Người dùng', render: (u) => `<b>${esc(u.user_name)}</b>` },
      { label: 'Yêu cầu', num: true, render: (u) => `${n(u.requests)}${u.denied ? ` <span class="pill err">${n(u.denied)} bị chặn</span>` : ''}` },
      { label: 'Tải lên', num: true, render: (u) => bytes(u.up_bytes) },
      { label: 'Tải về', num: true, render: (u) => bytes(u.down_bytes) },
      { label: 'Tên miền nhiều nhất', render: (u) => `<div style="max-width:520px;overflow-wrap:anywhere">${(u.hosts || []).slice(0, 8).map((h) => `<span class="chip">${esc(h.host)} · ${n(h.requests)}</span>`).join(' ')}${u.host_count > 8 ? ` <span class="muted">+${u.host_count - 8}</span>` : ''}</div>` },
    ], eg.users || [], 'Không có truy cập Internet trong khoảng này.');
  }

  async function renderTerminal() {
    let d;
    try { d = await api('/api/terminal/status'); }
    catch (err) { return card('Terminal', `<div class="muted">${esc(err.message)}</div>`); }
    const L = d.limits || {};
    const ev = d.events_24h || {};
    const all = d.terminals || [];
    const running = all.filter((t) => t.state === 'running');
    const hourButtons = [[24, '24 giờ'], [168, '7 ngày'], [720, '30 ngày'], [2160, '90 ngày']]
      .map(([h, l]) => `<button class="btn" type="button" data-tm-hours="${h}" aria-pressed="${tm.hours === h}">${l}</button>`).join('');
    const egressTitle = tm.egress
      ? `Truy cập Internet từ terminal <span class="row" style="gap:4px;display:inline-flex">${hourButtons}<button class="btn" type="button" data-tm-egress-close>Đóng</button></span>`
      : 'Truy cập Internet từ terminal <button class="btn" type="button" data-tm-egress>Xem</button>';
    const egressBody = tm.egress
      ? tmEgressHtml(tm.egress)
      : '<div class="muted">Mọi truy cập Internet của terminal đi qua proxy (cổng 80 / 443, chặn địa chỉ nội bộ) và được ghi lại 90 ngày: tên miền, lượng tải lên / tải về của từng người. Cần xác thực để xem.</div>';
    const terminals = table([
      { label: 'Người dùng', render: (t) => `<b>${esc(t.user_name)}</b>${t.role === 'admin' ? ' <span class="pill">admin</span>' : ''}<div class="muted">${esc(t.user_email || '')}</div>` },
      { label: 'Trạng thái', render: (t) => (t.state === 'running' ? `<span class="pill ok">${t.busy ? 'Đang chạy lệnh' : 'Đang chạy'}</span>` : t.state === 'stopped' ? '<span class="pill">Đã dừng</span>' : '<span class="pill">Chỉ còn file</span>') },
      { label: 'Rảnh', render: (t) => (t.busy ? '—' : tmIdle(t.idle_seconds)) },
      { label: 'Dung lượng', num: true, render: (t) => `${n(t.disk_mb)} MB${t.over_quota ? ' <span class="pill err">vượt hạn mức</span>' : ''}` },
      { label: '', render: (t) => `<span class="row" style="gap:4px;flex-wrap:nowrap">${t.state === 'running' ? `<button class="btn" type="button" data-tm-stop="${esc(t.id)}">Dừng</button>` : ''}<button class="btn" type="button" data-tm-remove="${esc(t.id)}">Xóa terminal và file</button></span>` },
    ], all, 'Chưa ai dùng terminal.');
    const events = table([
      { label: 'Lúc', render: (e) => when(e.ts * 1000) },
      { label: 'Sự kiện', render: (e) => `<span class="pill ${TM_BAD.includes(e.kind) ? 'err' : ''}">${esc(TM_EVENT[e.kind] || e.kind)}</span>` },
      { label: 'Người dùng', render: (e) => esc(e.user_name || '—') },
      { label: 'Chi tiết', render: (e) => `<span class="muted" style="overflow-wrap:anywhere">${esc(e.detail || '')}</span>` },
    ], d.recent_events || [], 'Chưa có sự kiện.');
    return `${tm.note ? `<div class="card">${esc(tm.note)}</div>` : ''}
      <div class="grid kpis">${kpi('Đang chạy', `${d.running} / ${d.max_running}`, `${d.admin_reserved} chỗ dành cho admin`)}
        ${kpi('Mỗi terminal', `${L.cpus} CPU · ${n(L.memory_mb)} MB`, `ổ ${n(L.disk_quota_mb)} MB · dừng sau ${L.idle_stop_minutes} phút rảnh · xóa sau ${L.volume_days} ngày`)}
        ${kpi('Hết chỗ (24 giờ)', n(ev.busy || 0), `nhường chỗ ${n(ev.evicted || 0)} lần`)}
        ${kpi('Vượt RAM / dung lượng (24 giờ)', `${n(ev.oom || 0)} / ${n(ev.over_quota || 0)}`)}</div>
      ${card(`Terminal của người dùng (${all.length})`, terminals, `${running.length} đang chạy; terminal dừng vẫn giữ file tới khi hết hạn`)}
      ${card('Sự kiện gần đây', events)}
      ${card(egressTitle, egressBody, 'qua egress-proxy')}`;
  }

  async function tmClick(b) {
    if (b.dataset.tmEgress !== undefined || b.dataset.tmHours) {
      if (!(await ensureSession('xem truy cập Internet của terminal'))) return true;
      if (b.dataset.tmHours) tm.hours = +b.dataset.tmHours;
      try { tm.egress = await api(`/api/admin/terminal/egress?hours=${tm.hours}`, { headers: editHeaders() }); tm.note = ''; }
      catch (err) { tm.note = `Không đọc được log Internet: ${err.message}`; }
      load(); return true;
    }
    if (b.dataset.tmEgressClose !== undefined) { tm.egress = null; load(); return true; }
    const id = b.dataset.tmStop || b.dataset.tmRemove;
    if (!id) return false;
    if (!(await ensureSession('quản lý terminal'))) return true;
    try {
      if (b.dataset.tmStop) {
        await api(`/api/admin/terminal/${encodeURIComponent(id)}/stop`, { method: 'POST', headers: editHeaders() });
        tm.note = 'Đã dừng terminal (file vẫn giữ).';
      } else {
        if (!confirm('Xóa terminal và toàn bộ file trong đó? Không khôi phục được.')) return true;
        await api(`/api/admin/terminal/${encodeURIComponent(id)}`, { method: 'DELETE', headers: editHeaders() });
        tm.note = 'Đã xóa terminal và file.';
      }
    } catch (err) { tm.note = `Lỗi: ${err.message}`; }
    load(); return true;
  }

  const RENDER = { files: renderFiles, trace: renderTrace, overview: renderOverview, load: renderLoad, tokens: renderTokens, models: renderModels, tools: renderTools, knowledge: renderKnowledge, tracker: renderTracker, reports: renderReports, terminal: renderTerminal, system: renderSystem };

  async function load() {
    const main = $('#main');
    try {
      const html = await RENDER[tab]();
      main.innerHTML = html;
      applyVisibility();
      $('#updated').textContent = `cập nhật ${new Date().toLocaleTimeString('vi-VN')}`;
      $('#live-dot').style.background = 'var(--green)';
    } catch (e) {
      main.innerHTML = `<div class="card error-box">Không tải được dữ liệu: ${esc(e.message)}</div>`;
      $('#live-dot').style.background = 'var(--red)';
    }
  }

  function renderChrome() {
    $('#tabs').innerHTML = TABS.map(([k, l]) => `<button role="tab" type="button" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join('');
    $('#ranges').innerHTML = RANGES.map(([k, l]) => `<button type="button" data-range="${k}" aria-pressed="${range === k}">${l}</button>`).join('');
    const theme = document.documentElement.getAttribute('data-theme') || '';
    $('#themes').innerHTML = [['', 'Tự động'], ['light', 'Sáng'], ['dark', 'Tối']].map(([k, l]) => `<button type="button" data-theme="${k}" aria-pressed="${theme === k}">${l}</button>`).join('');
  }

  function schedule() {
    clearInterval(timer);
    // Skip a refresh while the viewer is typing (search, reveal key), so the input is not wiped.
    if ($('#auto').checked) timer = setInterval(() => document.visibilityState === 'visible' && !document.activeElement?.matches('input, select') && !(tab === 'system' && editor.open) && !(tab === 'knowledge' && filePanels.tab.viewer) && !(tab === 'files' && fp.view) && !(tab === 'reports' && (rp.edit || rp.settings)) && !(tab === 'terminal' && tm.egress) && load(), 30000);
  }

  document.addEventListener('input', (e) => {
    if (e.target.id === 'trace-q') { clearTimeout(window.__tq); window.__tq = setTimeout(() => { traceQuery = e.target.value; traceId = ''; load().then(() => { const el = $('#trace-q'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }); }, 400); }
  });
  document.addEventListener('click', async (e) => {
    const copy = e.target.closest('[data-copy]');
    if (copy) { try { await navigator.clipboard.writeText(copy.dataset.copy); copy.title = 'Đã sao chép'; } catch {} return; }
    const row = e.target.closest('tr[data-trace]');
    if (row && !e.target.closest('a')) { revealed = { id: '', question: '', answer: '' }; revealError = ''; traceId = row.dataset.trace; tab = 'trace'; history.replaceState(null, '', `#trace-${traceId}`); renderChrome(); load(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    const fpRow = e.target.closest('tr[data-fp-open]');
    if (fpRow && !e.target.closest('button, input, a')) { fp.fileId = fpRow.dataset.fpOpen; fp.detail = null; fp.filter = ''; fp.view = null; fp.note = ''; fp.selected.clear(); load(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    const fpCheck = e.target.closest('input[data-fp-select]');
    if (fpCheck) { const page = +fpCheck.dataset.fpSelect; if (fpCheck.checked) fp.selected.add(page); else fp.selected.delete(page); const btn = document.querySelector('[data-fp-repair-selected]'); if (btn) { btn.disabled = !fp.selected.size; btn.textContent = `Sửa lại ${fp.selected.size || ''} trang đã chọn`; } return; }
    const b = e.target.closest('button');
    if (!b) return;
    if (tab === 'reports' && Object.keys(b.dataset).some((k) => k.startsWith('rp')) && (await rpClick(b))) return;
    if (tab === 'reports' && Object.keys(b.dataset).some((k) => k.startsWith('tg')) && (await tgClick(b))) return;
    if (tab === 'terminal' && Object.keys(b.dataset).some((k) => k.startsWith('tm')) && (await tmClick(b))) return;
    if (b.dataset.txTeam) {
      if (!(await ensureSession('quản lý chủ kênh / người quản lý'))) return;
      try { tx.team = { ...(await api(`/api/admin/tracker/channels/${encodeURIComponent(b.dataset.txTeam)}/team`, { headers: editHeaders() })), id: b.dataset.txTeam }; }
      catch (err) { tx.rebuildNote = `Không đọc được thành viên kênh: ${err.message}`; }
      load(); return;
    }
    if (b.dataset.txTeamClose !== undefined) { tx.team = null; load(); return; }
    if (b.dataset.txOwner || b.dataset.txManager) {
      if (!tx.team || !(await ensureSession('đổi chủ kênh / người quản lý'))) return;
      const id = tx.team.id;
      try {
        if (b.dataset.txOwner) {
          if (!confirm(`Chuyển chủ kênh "${tx.team.channel}" cho ${b.dataset.txName}?`)) return;
          await api(`/api/admin/tracker/channels/${encodeURIComponent(id)}/owner`, { method: 'POST', headers: editHeaders(), body: JSON.stringify({ user_id: b.dataset.txOwner }) });
          tx.rebuildNote = `Đã chuyển chủ kênh "${tx.team.channel}" cho ${b.dataset.txName}.`;
        } else {
          await api(`/api/admin/tracker/channels/${encodeURIComponent(id)}/managers`, { method: 'POST', headers: editHeaders(), body: JSON.stringify({ user_id: b.dataset.txManager, manager: b.dataset.txOn === '1' }) });
        }
        tx.team = { ...(await api(`/api/admin/tracker/channels/${encodeURIComponent(id)}/team`, { headers: editHeaders() })), id };
      } catch (err) { tx.rebuildNote = `Không thực hiện được: ${err.message}`; }
      load(); return;
    }
    if (b.dataset.txRebuildAll !== undefined) {
      if (!(await ensureSession('tổng hợp lại tất cả kênh'))) return;
      let p;
      try { p = await api('/api/admin/tracker/channels-rebuild-all?days=30', { headers: editHeaders() }); }
      catch (err) { tx.rebuildNote = `Không đọc được danh sách kênh: ${err.message}`; load(); return; }
      const list = p.channels || [];
      if (!list.length) { tx.rebuildNote = 'Không có kênh nào có tin nhắn trong 30 ngày qua.'; load(); return; }
      const lines = list.slice(0, 25).map((c) => `• ${c.channel}: ${c.messages} tin, ${c.open_items} việc đang mở${c.running ? ' (đang tổng hợp, bỏ qua)' : ''}`).join('\n');
      const messages = list.reduce((sum, c) => sum + (c.messages || 0), 0);
      if (!confirm(`Tổng hợp lại ${list.length} kênh có tin nhắn trong 30 ngày qua (${messages} tin nhắn)?\n\n${lines}${list.length > 25 ? `\n… và ${list.length - 25} kênh khác` : ''}\n\n• Mọi tin nhắn và file của các kênh này được đọc lại bằng phiên bản hiện tại (tốn nhiều lượt gọi model; các kênh được xử lý lần lượt vài kênh một lúc).\n• Việc đang mở được thay bằng kết quả mới; chỉnh tay trên các việc này sẽ mất. Việc đã đóng/hủy được giữ.
• Trong lúc đọc lại, bảng tiến độ, nhắc việc và báo cáo vẫn dùng bản cũ; đọc xong mới thay. Mỗi lúc chỉ một kênh được tổng hợp lại, kênh nhiều tin có thể mất hàng giờ.
• Trạng thái (hoàn thành, hạn, người phụ trách) được đọc lại từ tin nhắn và file: cần kiểm tra lại sau khi xong. Chỉ dùng khi thật cần (việc rác, việc thiếu do lỗi cũ).`)) return;
      b.disabled = true;
      try {
        const r = await api('/api/admin/tracker/channels-rebuild-all', { method: 'POST', headers: editHeaders(), body: JSON.stringify({ days: 30 }) });
        tx.rebuildNote = `Đã bắt đầu tổng hợp lại ${r.started.length} kênh.${r.skipped.length ? ` Bỏ qua (đang tổng hợp): ${r.skipped.join(', ')}.` : ''}${r.failed.length ? ` Lỗi: ${r.failed.map((f) => `${f.channel} (${f.error})`).join('; ')}.` : ''} Cột "Chờ tổng hợp" giảm dần đến 0 khi xong.`;
      } catch (err) { tx.rebuildNote = `Không tổng hợp lại được: ${err.message}`; }
      load(); return;
    }
    if (b.dataset.txRebuild) {
      if (!(await ensureSession('tổng hợp lại kênh'))) return;
      const id = b.dataset.txRebuild;
      let p;
      try { p = await api(`/api/admin/tracker/channels/${encodeURIComponent(id)}/rebuild`, { headers: editHeaders() }); }
      catch (err) { tx.rebuildNote = `Không đọc được thông tin kênh: ${err.message}`; load(); return; }
      if (p.running) { tx.rebuildNote = `Kênh "${p.channel}" đang được tổng hợp, thử lại sau khi lượt hiện tại xong.`; load(); return; }
      if (!confirm(`Tổng hợp lại kênh "${p.channel}"?\n\n• Đọc lại ${p.messages} tin nhắn và ${p.files} file bằng phiên bản hiện tại (tốn lượt gọi model, có thể mất vài phút đến vài chục phút).\n• ${p.open_items} việc đang mở sẽ được thay bằng kết quả mới; chỉnh tay trên các việc này sẽ mất.\n• ${p.archived_items} việc đã đóng/hủy được giữ, không bị tạo lại.
• Trong lúc đọc lại, bảng tiến độ, nhắc việc và báo cáo vẫn dùng bản cũ; đọc xong mới thay. Mỗi lúc chỉ một kênh được tổng hợp lại, kênh nhiều tin có thể mất hàng giờ.
• Trạng thái (hoàn thành, hạn, người phụ trách) được đọc lại từ tin nhắn và file: cần kiểm tra lại sau khi xong. Chỉ dùng khi thật cần (việc rác, việc thiếu do lỗi cũ).`)) return;
      b.disabled = true;
      try { const r = await api(`/api/admin/tracker/channels/${encodeURIComponent(id)}/rebuild`, { method: 'POST', headers: editHeaders(), body: '{}' }); tx.rebuildNote = `Đã bắt đầu tổng hợp lại "${r.channel}": ${r.messages} tin nhắn, ${r.files} file. Cột "Chờ tổng hợp" giảm dần đến 0 khi xong.`; }
      catch (err) { tx.rebuildNote = `Không tổng hợp lại được: ${err.message}`; }
      load(); return;
    }
    if (b.dataset.txOpen) { await openExtraction(b.dataset.txOpen); return; }
    if (b.dataset.txItems) { await openChannelItems(b.dataset.txItems); return; }
    if (b.dataset.txItemsClose !== undefined) { tx.items = null; drawTxItems(); return; }
    if (b.dataset.txItemsFilter) { tx.items.filter = b.dataset.txItemsFilter; tx.items.trace = null; drawTxItems(); return; }
    if (b.dataset.txTrace) { await openTrace(b.dataset.txTrace); return; }
    if (b.dataset.txTraceClose !== undefined) { tx.items.trace = null; drawTxItems(); return; }
    if (b.dataset.txClose !== undefined) { tx.view = null; drawTxView(); return; }
    if (b.dataset.txReimport !== undefined) {
      if (!(await ensureSession('đọc lại đầu việc của file'))) return;
      if (!b.dataset.txReimport || !confirm(`Đọc lại đầu việc của "${b.dataset.txName}" ở lần tổng hợp tới? Việc đã có được cập nhật theo khóa dòng, không tạo trùng.`)) return;
      try { const r = await api(`/api/admin/tracker/files/${encodeURIComponent(b.dataset.txReimport)}/reimport`, { method: 'POST', headers: editHeaders(), body: '{}' }); tx.note = `Đã xếp lịch đọc lại (${r.messages} tin nhắn ở ${r.channels} kênh); kết quả hiện sau lần tổng hợp tới.`; }
      catch (err) { tx.note = `Không đọc lại được: ${err.message}`; }
      load(); return;
    }
    if (b.dataset.txSpec) { tx.editing = b.dataset.txSpec; tx.draft = ''; load(); return; }
    if (b.dataset.txSpecClose !== undefined) { tx.editing = ''; tx.draft = ''; load(); return; }
    if (b.dataset.txSpecSave) {
      if (!(await ensureSession('lưu bản mô tả bảng'))) return;
      const text = document.getElementById('tx-spec')?.value || '';
      let spec;
      try { spec = JSON.parse(text); } catch (err) { tx.draft = text; tx.note = `JSON không hợp lệ: ${err.message}`; load(); return; }
      try { await api(`/api/admin/tracker/table-specs/${encodeURIComponent(b.dataset.txSpecSave)}`, { method: 'POST', headers: editHeaders(), body: JSON.stringify({ spec }) }); tx.note = 'Đã lưu. Bấm "Đọc lại" ở file tương ứng để áp dụng.'; tx.editing = ''; tx.draft = ''; }
      catch (err) { tx.draft = text; tx.note = `Không lưu được: ${err.message}`; }
      load(); return;
    }
    if (b.dataset.fpDownload) { b.disabled = true; await downloadFile(b.dataset.fpDownload, b.dataset.fpName); b.disabled = false; return; }
    if (b.dataset.fpStatus !== undefined) { fp.status = b.dataset.fpStatus; load(); return; }
    if (b.dataset.fpBack !== undefined) { if (fp.view?.img) URL.revokeObjectURL(fp.view.img); fp.fileId = ''; fp.detail = null; fp.view = null; fp.note = ''; load(); return; }
    if (b.dataset.fpFilter !== undefined) { fp.filter = b.dataset.fpFilter; load(); return; }
    if (b.dataset.fpPage) { await openFilePage(+b.dataset.fpPage); return; }
    if (b.dataset.fpMode) { fp.view.mode = b.dataset.fpMode; drawFilePage(); return; }
    if (b.dataset.fpReview) { b.disabled = true; await reviewPage(b.dataset.fpReview); return; }
    if (b.dataset.fpReviewEdit !== undefined) { fp.view.editing = !fp.view.editing; drawFilePage(); return; }
    if (b.dataset.fpPagePrev !== undefined) { await openFilePage(fp.view.data.page - 1); return; }
    if (b.dataset.fpPageNext !== undefined) { await openFilePage(fp.view.data.page + 1); return; }
    if (b.dataset.fpPageClose !== undefined) { if (fp.view?.img) URL.revokeObjectURL(fp.view.img); fp.view = null; drawFilePage(); return; }
    if (b.dataset.fpRepairSelected !== undefined) { await runPipeline([...fp.selected].sort((x, y) => x - y)); return; }
    if (b.dataset.fpRerun !== undefined) { await runPipeline([]); return; }
    if (b.dataset.fpBackfill !== undefined) {
      if (!(await ensureSession('xử lý các file cũ'))) return;
      if (!confirm('Đưa các file tải lên trong 30 ngày qua (chưa từng xử lý, tối đa 50 file) vào hàng đợi?')) return;
      try { const r = await api('/api/admin/files/pipeline/backfill', { method: 'POST', headers: editHeaders(), body: JSON.stringify({ days: 30, limit: 50 }) }); fp.note = `Đã đưa ${r.queued} file vào hàng đợi.`; } catch (err) { fp.note = `Thất bại: ${err.message}`; }
      load(); return;
    }
    if (b.dataset.openEditor !== undefined) { if (editor.open) { editor.open = false; drawEditor(); } else { await openEditor(); } return; }
    if (b.dataset.saveGroup) { await saveGroup(b.dataset.saveGroup); return; }
    if (b.dataset.filesLoad !== undefined) { await loadFiles(b.dataset.panel); return; }
    if (b.dataset.filesFilter !== undefined) { filePanels[b.dataset.panel].filter = b.dataset.filesFilter; drawFiles(b.dataset.panel); return; }
    if (b.dataset.fileView) { await openViewer(b.dataset.panel, b.dataset.fileView); return; }
    if (b.dataset.viewerMode) { filePanels[b.dataset.panel].viewer.mode = b.dataset.viewerMode; drawFiles(b.dataset.panel); return; }
    if (b.dataset.viewerClose !== undefined) { const P = filePanels[b.dataset.panel]; if (P.viewer?.url) URL.revokeObjectURL(P.viewer.url); P.viewer = null; drawFiles(b.dataset.panel); return; }
    if (b.dataset.fileReprocess) { await reprocessFile(b.dataset.panel, b.dataset.fileReprocess); return; }
    if (b.dataset.testExtraction !== undefined) { b.disabled = true; await testExtraction(); b.disabled = false; return; }
    if (b.dataset.testEmail !== undefined) { b.disabled = true; await testEmail(b.dataset.testEmail === 'owner' ? 'owner' : 'assignee'); b.disabled = false; return; }
    if (b.dataset.modelPublic) {
      const toPublic = b.dataset.to === '1';
      if (!toPublic && !confirm(`Đặt "${b.dataset.modelName}" thành riêng tư? Người dùng thường (không được chia sẻ riêng) sẽ không chọn được model này nữa.`)) return;
      b.disabled = true;
      try {
        await api('/api/admin/models/access', { method: 'POST', headers: editHeaders(), body: JSON.stringify({ model_id: b.dataset.modelPublic, public: toPublic, name: b.dataset.modelName }) });
        const item = (editor.models.models || []).find((x) => x.id === b.dataset.modelPublic);
        if (item) { item.public = toPublic; item.configured = true; }
        editor.error = '';
      } catch (err) { editor.error = err.message; drawEditor(); return; }
      drawModels(); return;
    }
    if (b.dataset.modelDefault !== undefined) {
      try {
        const value = $('#model-default').value;
        await api('/api/admin/models/default', { method: 'POST', headers: editHeaders(), body: JSON.stringify({ value }) });
        editor.models.default_access = value; editor.note = 'Đã lưu quyền mặc định cho model mới.'; editor.error = '';
      } catch (err) { editor.error = err.message; }
      drawEditor(); return;
    }
    if (b.dataset.reindex !== undefined) {
      if (!confirm('Lập chỉ mục lại toàn bộ vector kiến thức và bộ nhớ bằng model embedding hiện tại? Việc này có thể mất từ vài phút đến hàng giờ và gọi model embedding cho mọi file.')) return;
      try { editor.reindex = await api('/api/admin/reindex', { method: 'POST', headers: editHeaders() }); editor.error = ''; editor.note = editor.reindex.already_running ? 'Đang có một lần lập chỉ mục lại chạy, theo dõi tiến độ bên dưới.' : 'Đã bắt đầu lập chỉ mục lại.'; }
      catch (err) { editor.error = err.message; }
      drawEditor(); watchReindex(); return;
    }
    if (b.dataset.connAdd !== undefined || b.dataset.connUp !== undefined || b.dataset.connRemove !== undefined || b.dataset.connTest !== undefined || b.dataset.connSave !== undefined) { await connectionAction(b); return; }
    if (b.dataset.termTest !== undefined || b.dataset.termSave !== undefined) { await terminalAction(b); return; }
    if (b.dataset.lock !== undefined) { try { await api('/api/admin/lock', { method: 'POST', headers: editHeaders() }); } catch {} editor.token = ''; editor.data = null; editor.note = ''; drawEditor(); return; }
    if (b.dataset.hideContent !== undefined) { const id = revealed.id; revealed = { id: '', question: '', answer: '' }; const box = $('#reveal-box'); if (box) box.innerHTML = revealBox(id); return; }
    if (b.dataset.traceMin !== undefined) { traceMin = +b.dataset.traceMin; traceId = ''; load(); return; }
    if (b.dataset.traceSource !== undefined) { traceSource = b.dataset.traceSource; traceId = ''; load(); return; }
    if (b.dataset.tab) { tab = b.dataset.tab; store('mon.tab', tab); history.replaceState(null, '', `#${tab}`); renderChrome(); $('#main').innerHTML = '<div class="empty"><span class="spin"></span> Đang tải…</div>'; load(); }
    else if (b.dataset.range) { range = b.dataset.range; store('mon.range', range); renderChrome(); load(); }
    else if (b.dataset.theme !== undefined) { const t = b.dataset.theme; if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); store('mon.theme', t); renderChrome(); }
    else if (b.dataset.source !== undefined) { tokenSource = b.dataset.source; load(); }
    else if (b.dataset.tool !== undefined) { toolFilter = b.dataset.tool; load(); }
    else if (b.id === 'refresh') load();
    else if (b.dataset.probe) {
      if (probing) return;
      probing = b.dataset.probe;
      const paint = (disabled) => {
        // Look the box up again: an auto-refresh may have redrawn the tab while measuring.
        const out = $('#probe-out'); if (out) out.innerHTML = probeOut();
        document.querySelectorAll('[data-probe]').forEach((x) => (x.disabled = disabled));
      };
      paint(true);
      try { probeResult = await api(`/api/probe?llm=${probing}`, { method: 'POST' }); }
      catch (err) { probeResult = { error: err.message }; }
      probing = '';
      paint(false);
    }
  });
  $('#auto').addEventListener('change', schedule);

  const savedTheme = store('mon.theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  renderChrome();
  load();
  schedule();
})();
</script>
</body>
</html>
