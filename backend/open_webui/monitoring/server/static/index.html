<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCS AI Monitor</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --raised: #f2f3f6; --line: #e5e7eb; --line-strong: #d1d5db;
    --text: #111827; --muted: #6b7280; --faint: #9ca3af;
    --blue: #2563eb; --blue-soft: #e8efff; --green: #16a34a; --green-soft: #e7f6ec;
    --red: #dc2626; --red-soft: #fdecec; --amber: #d97706; --amber-soft: #fdf3e2;
    --violet: #7c3aed; --cyan: #0891b2; --pink: #db2777;
    --shadow: 0 1px 2px rgba(17,24,39,.05), 0 6px 18px rgba(17,24,39,.05);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0f11; --panel: #17181b; --raised: #1f2125; --line: #2a2d32; --line-strong: #3a3e45;
      --text: #e8eaed; --muted: #a0a6b0; --faint: #6b7280;
      --blue: #60a5fa; --blue-soft: #16233f; --green: #4ade80; --green-soft: #12301f;
      --red: #f87171; --red-soft: #3a1717; --amber: #fbbf24; --amber-soft: #3a2a0c;
      --violet: #a78bfa; --cyan: #22d3ee; --pink: #f472b6;
      --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0f11; --panel: #17181b; --raised: #1f2125; --line: #2a2d32; --line-strong: #3a3e45;
    --text: #e8eaed; --muted: #a0a6b0; --faint: #6b7280;
    --blue: #60a5fa; --blue-soft: #16233f; --green: #4ade80; --green-soft: #12301f;
    --red: #f87171; --red-soft: #3a1717; --amber: #fbbf24; --amber-soft: #3a2a0c;
    --violet: #a78bfa; --cyan: #22d3ee; --pink: #f472b6;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1320px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .brand { font-weight: 650; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .brand small { color: var(--muted); font-weight: 400; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; padding: 2px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line); }
  .seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 550; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 5px 11px; font-size: 12.5px; cursor: pointer; }
  .btn:hover { border-color: var(--line-strong); }
  .btn.primary { background: var(--text); color: var(--panel); border-color: var(--text); }
  nav.tabs { max-width: 1320px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; }
  nav.tabs button { border: 0; background: transparent; padding: 9px 12px; font-size: 13px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); font-weight: 550; }
  main { max-width: 1320px; margin: 0 auto; padding: 18px 16px 48px; display: grid; gap: 16px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
  @media (max-width: 520px) { .cols { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
  .card h2 { font-size: 13.5px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h2 small { color: var(--muted); font-weight: 400; font-size: 12px; }
  .kpi .label { font-size: 12px; color: var(--muted); }
  .kpi .value { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .kpi .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th { text-align: left; color: var(--muted); font-weight: 550; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: default; }
  th.sort { cursor: pointer; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .ok { background: var(--green-soft); color: var(--green); }
  .err { background: var(--red-soft); color: var(--red); }
  .warn { background: var(--amber-soft); color: var(--amber); }
  .info { background: var(--blue-soft); color: var(--blue); }
  .muted { color: var(--muted); }
  .chip { display: inline-flex; gap: 4px; align-items: center; font-size: 11.5px; padding: 1px 7px; border-radius: 7px; background: var(--raised); border: 1px solid var(--line); margin: 1px 3px 1px 0; white-space: nowrap; }
  .chip b { font-weight: 600; }
  .meter { height: 6px; border-radius: 999px; background: var(--raised); overflow: hidden; min-width: 80px; }
  .meter > div { height: 100%; border-radius: inherit; background: var(--blue); }
  svg.chart { width: 100%; height: 190px; display: block; }
  svg.chart text { fill: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  svg.chart .grid line { stroke: var(--line); }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .flow { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); counter-reset: step; }
  .step { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--raised); position: relative; }
  .step b { display: block; font-size: 13px; margin-bottom: 3px; }
  .step span { font-size: 12px; color: var(--muted); }
  .step.off { opacity: .55; }
  .step.off b::after { content: " (đang tắt)"; font-weight: 400; color: var(--muted); }
  .notice { border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.5; }
  .notice.warn { border: 1px solid var(--amber); }
  .notice.info { border: 1px solid var(--blue); }
  .kv { display: grid; grid-template-columns: minmax(140px, max-content) 1fr; gap: 4px 14px; font-size: 12.5px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .empty { color: var(--muted); font-size: 13px; padding: 14px 0; text-align: center; }
  .error-box { color: var(--red); font-size: 13px; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line-strong); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  [hidden] { display: none !important; }
  .editor-groups { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }
  @media (max-width: 520px) { .editor-groups { grid-template-columns: 1fr; } }
  .field { display: grid; gap: 3px; margin-bottom: 10px; }
  .field label { font-size: 12.5px; font-weight: 550; }
  .field small { color: var(--muted); font-size: 11.5px; }
  .field input[type=text], .field input[type=number], .field input[type=password], .field select {
    border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 9px; font-size: 13px; width: 100%; }
  .field .check { display: flex; gap: 7px; align-items: center; font-size: 13px; font-weight: 400; }
  .conn-row { display: grid; grid-template-columns: 34px minmax(220px, 2fr) minmax(170px, 1.2fr) 120px auto; gap: 8px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .conn-row:last-of-type { border-bottom: 0; }
  @media (max-width: 860px) { .conn-row { grid-template-columns: 34px 1fr; } .conn-row > :nth-child(n+3) { grid-column: 2; } }
  .conn-row input[type=text], .conn-row input[type=password] { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 9px; font-size: 13px; width: 100%; }
  .conn-n { font-weight: 650; color: var(--muted); padding-top: 6px; font-variant-numeric: tabular-nums; }
  .conn-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .conn-test { grid-column: 2 / -1; font-size: 12px; }
  .lockbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .trace-row { cursor: pointer; }
  .trace-row:hover td { background: var(--raised); }
  .trace-row.active td { background: var(--blue-soft); }
  .wf { display: grid; gap: 4px; }
  .wf-row { display: grid; grid-template-columns: 26px minmax(150px, 260px) minmax(0, 1fr) 84px; gap: 10px; align-items: center; font-size: 12.5px; }
  @media (max-width: 700px) { .wf-row { grid-template-columns: 22px minmax(0, 1fr) 70px; } .wf-row .wf-track { grid-column: 1 / -1; } }
  .wf-n { color: var(--faint); font-variant-numeric: tabular-nums; text-align: right; }
  .wf-label { min-width: 0; }
  .wf-label b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .wf-label span { color: var(--muted); font-size: 11.5px; }
  .wf-track { position: relative; height: 18px; background: var(--raised); border-radius: 5px; }
  .wf-bar { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; min-width: 2px; }
  .wf-bar.llm { background: var(--violet); }
  .wf-bar.llm .ttft { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px 0 0 4px; background: repeating-linear-gradient(135deg, rgba(255,255,255,.45) 0 3px, transparent 3px 6px); }
  .wf-bar.tool { background: var(--blue); }
  .wf-bar.prep { background: var(--faint); }
  .wf-bar.task { background: var(--line-strong); }
  .wf-bar.err { background: var(--red); }
  .wf-dur { text-align: right; font-variant-numeric: tabular-nums; }
  .wf-axis { display: grid; grid-template-columns: 26px minmax(150px, 260px) minmax(0, 1fr) 84px; gap: 10px; font-size: 10.5px; color: var(--muted); }
  .wf-axis div:nth-child(3) { display: flex; justify-content: space-between; }
  @media (max-width: 700px) { .wf-axis { display: none; } }
  .split { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--raised); }
  .split span { height: 100%; }
  .qbox { background: var(--raised); border-radius: 10px; padding: 10px 12px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 180px; overflow: auto; }
  .ids code { font-size: 11.5px; background: var(--raised); padding: 1px 6px; border-radius: 6px; cursor: copy; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="dot" id="live-dot"></span> NCS AI Monitor <small id="updated">đang tải…</small></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Khoảng thời gian" id="ranges"></div>
      <label class="muted" style="font-size:12.5px;display:flex;gap:5px;align-items:center"><input type="checkbox" id="auto" checked> Tự làm mới 30 giây</label>
      <button class="btn" id="refresh" type="button">Làm mới</button>
      <div class="seg" role="group" aria-label="Giao diện" id="themes"></div>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="main"><div class="empty"><span class="spin"></span> Đang tải…</div></main>

<script>
(() => {
  const TABS = [
    ['overview', 'Tổng quan'], ['trace', 'Chi tiết lượt'], ['load', 'Người dùng & tải'], ['tokens', 'Token'], ['models', 'Tốc độ model'], ['tools', 'Function call'],
    ['knowledge', 'Kiến thức'], ['tracker', 'Tracker'], ['system', 'Thành phần & tài nguyên'],
  ];
  const RANGES = [['1h', '1 giờ'], ['24h', '24 giờ'], ['7d', '7 ngày'], ['30d', '30 ngày'], ['90d', '90 ngày']];
  const SOURCE = { chat: 'Chat', channel: 'Kênh', task: 'Tác vụ nền', api: 'API', tracker: 'Tracker', upload: 'Tải lên chat', knowledge: 'Kho kiến thức' };
  const COLORS = ['var(--blue)', 'var(--violet)', 'var(--green)', 'var(--amber)', 'var(--pink)', 'var(--cyan)', 'var(--red)'];
  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } };
  let tab = /^#trace-/.test(location.hash) ? 'trace' : (location.hash || '').slice(1) || store('mon.tab') || 'overview';
  if (!TABS.some(([k]) => k === tab)) tab = 'overview';
  let range = store('mon.range') || '24h';
  let timer = null;
  let tokenSource = '';
  let toolFilter = '';
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const nf = new Intl.NumberFormat('vi-VN');
  const n = (v) => (v === null || v === undefined ? '—' : nf.format(Math.round(v)));
  const ms = (v) => (v === null || v === undefined ? '—' : v < 1000 ? `${Math.round(v)} ms` : `${(v / 1000).toLocaleString('vi-VN', { maximumFractionDigits: v < 10000 ? 2 : 1 })} s`);
  const tok = (v) => { if (v === null || v === undefined) return '—'; if (v >= 1e6) return `${(v / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 2 })} tr`; if (v >= 1e3) return `${(v / 1e3).toLocaleString('vi-VN', { maximumFractionDigits: 1 })} K`; return nf.format(Math.round(v)); };
  const bytes = (v) => { if (!v && v !== 0) return '—'; const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; } return `${v.toLocaleString('vi-VN', { maximumFractionDigits: i > 1 ? 1 : 0 })} ${u[i]}`; };
  const pct = (a, b) => (b ? `${((a / b) * 100).toLocaleString('vi-VN', { maximumFractionDigits: 1 })}%` : '—');
  const when = (t) => new Date(t).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
  const status = (s) => (s === 'ok' ? '<span class="pill ok">OK</span>' : `<span class="pill err">${esc(s || 'lỗi')}</span>`);
  const yes = (v) => (v ? '<span class="pill ok">Bật</span>' : '<span class="pill">Tắt</span>');

  async function api(path, opts = {}) {
    const res = await fetch(path, { credentials: 'same-origin', ...opts });
    if (!res.ok) { let d = ''; try { d = (await res.json()).detail; } catch {} throw new Error(d || `HTTP ${res.status}`); }
    return res.json();
  }

  // ---------- charts (plain SVG) ----------
  function lineChart(series, { format = (v) => v, bucket = 0 } = {}) {
    const W = 640, H = 190, L = 52, R = 10, T = 10, B = 24;
    const pts = series.flatMap((s) => s.points);
    if (!pts.length) return '<div class="empty">Chưa có dữ liệu trong khoảng này.</div>';
    const xs = pts.map((p) => p[0]); let x0 = Math.min(...xs), x1 = Math.max(...xs);
    if (x0 === x1) { x0 -= bucket || 60000; x1 += bucket || 60000; }
    const ymax = Math.max(...pts.map((p) => p[1] || 0)) * 1.1 || 1;
    const X = (x) => L + ((x - x0) / (x1 - x0)) * (W - L - R);
    const Y = (y) => T + (1 - (y || 0) / ymax) * (H - T - B);
    let g = '<g class="grid">';
    for (let i = 0; i <= 4; i++) { const y = T + (i / 4) * (H - T - B); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 3}" text-anchor="end">${esc(format((ymax * (4 - i)) / 4))}</text>`; }
    for (let i = 0; i <= 4; i++) { const x = x0 + (i / 4) * (x1 - x0); g += `<text x="${X(x)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === 4 ? 'end' : 'middle'}">${esc(when(x))}</text>`; }
    g += '</g>';
    const lines = series.map((s, i) => {
      const color = s.color || COLORS[i % COLORS.length];
      const sorted = [...s.points].sort((a, b) => a[0] - b[0]);
      const d = sorted.map((p, j) => `${j ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
      const area = s.area && sorted.length > 1 ? `<path d="${d}L${X(sorted.at(-1)[0])},${H - B}L${X(sorted[0][0])},${H - B}Z" fill="${color}" opacity=".1"/>` : '';
      const dots = sorted.length < 40 ? sorted.map((p) => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="2.4" fill="${color}"><title>${esc(when(p[0]))}: ${esc(format(p[1]))}</title></circle>`).join('') : '';
      return `${area}<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>${dots}`;
    }).join('');
    const legend = series.length > 1 ? `<div class="legend">${series.map((s, i) => `<span><i style="background:${s.color || COLORS[i % COLORS.length]}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">${g}${lines}</svg>${legend}`;
  }
  function bars(items, { format = n, color = 'var(--blue)' } = {}) {
    if (!items.length) return '<div class="empty">Chưa có dữ liệu.</div>';
    const max = Math.max(...items.map((i) => i.value || 0)) || 1;
    return `<div style="display:grid;gap:6px">${items.map((i) => `<div style="display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:8px;align-items:center;font-size:12.5px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(i.label)}">${esc(i.label)}</span><div class="meter"><div style="width:${((i.value || 0) / max) * 100}%;background:${i.color || color}"></div></div><span class="num" style="font-variant-numeric:tabular-nums">${esc(format(i.value))}</span></div>`).join('')}</div>`;
  }
  const kpi = (label, value, sub = '') => `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
  const card = (title, body, note = '') => `<section class="card"><h2>${title}${note ? `<small>${note}</small>` : ''}</h2>${body}</section>`;
  // rowAttr(row) adds attributes to a row, e.g. data-trace to open the timeline of that answer.
  const traceAttr = (r) => (r.message_id ? `class="trace-row${r.message_id === traceId ? ' active' : ''}" data-trace="${esc(r.message_id)}" title="Xem timeline"` : '');
  function table(cols, rows, empty = 'Chưa có dữ liệu.', rowAttr = null) {
    if (!rows.length) return `<div class="empty">${empty}</div>`;
    return `<div class="table-wrap"><table><thead><tr>${cols.map((c) => `<th class="${c.num ? 'num' : ''}">${c.label}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr ${rowAttr ? rowAttr(r) : ''}>${cols.map((c) => `<td class="${c.num ? 'num' : ''}">${c.render ? c.render(r) : esc(r[c.key] ?? '—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  const statCols = [
    { label: 'Số lần', num: true, render: (r) => n(r.count) },
    { label: 'TB', num: true, render: (r) => ms(r.avg_ms) },
    { label: 'p50', num: true, render: (r) => ms(r.p50_ms) },
    { label: 'p95', num: true, render: (r) => ms(r.p95_ms) },
    { label: 'Lỗi', num: true, render: (r) => (r.errors ? `<span style="color:var(--red)">${n(r.errors)} (${pct(r.errors, r.count)})</span>` : '0') },
  ];

  const KIND = { llm_call: 'Gọi model', response: 'Trả lời', tool: 'Function', tracker: 'Tracker', ingest: 'Tải tài liệu', rag: 'Truy xuất' };
  const errorTable = (list, empty = 'Không có lỗi trong khoảng này.') => table([
    { label: 'Lúc', render: (r) => when(r.ts) },
    { label: 'Loại', render: (r) => `<span class="pill err">${esc(KIND[r.kind] || r.kind || 'Function')}</span>` },
    { label: 'Tên', render: (r) => `<b>${esc(r.name || r.model_id || '—')}</b>${r.name && r.model_id ? `<div class="muted">${esc(r.model_id)}</div>` : ''}` },
    { label: 'Người dùng', render: (r) => esc(r.user_name || '—') },
    { label: 'Nguồn', render: (r) => SOURCE[r.source] || esc(r.source || '—') },
    { label: 'Chi tiết lỗi', render: (r) => `<div style="max-width:520px;white-space:pre-wrap;overflow-wrap:anywhere">${esc(r.error || r.error_type || 'không có nội dung')}</div>${r.arguments ? `<div class="muted" style="margin-top:3px;overflow-wrap:anywhere">Tham số: <code>${esc(r.arguments)}</code></div>` : ''}` },
    { label: 'Thời gian', num: true, render: (r) => ms(r.duration_ms) },
  ], list, empty);

  // ---------- tabs ----------
  async function renderOverview() {
    const d = await api(`/api/overview?range=${range}`);
    const r = d.responses, c = d.calls;
    const series = d.series;
    return `<div class="grid">
        ${kpi('Lượt trả lời', n(r.count), `${n(r.users)} người dùng`)}
        ${kpi('Thời gian trả lời TB', ms(r.avg_ms), `p95 ${ms(r.p95_ms)}`)}
        ${kpi('Ra chữ đầu tiên TB', ms(c.avg_ttft), `p95 ${ms(c.p95_ttft)}`)}
        ${kpi('Tốc độ sinh TB', c.tokens_per_second ? `${n(c.tokens_per_second)} token/s` : '—', `${n(c.count)} lần gọi model`)}
        ${kpi('Token vào / ra', `${tok(c.input_tokens)} / ${tok(c.output_tokens)}`, 'tất cả model')}
        ${kpi('Function call', n(r.tool_calls), r.count ? `TB ${(r.tool_calls / r.count || 0).toLocaleString('vi-VN', { maximumFractionDigits: 1 })} / lượt` : '')}
        ${kpi('Tỷ lệ lỗi', pct((r.errors || 0) + (c.errors || 0), (r.count || 0) + (c.count || 0)), `${n((r.errors || 0) + (c.errors || 0))} lỗi`)}
      </div>
      <div class="cols">
        ${card('Số lượt trả lời', lineChart([{ name: 'Lượt trả lời', points: series.map((p) => [p.t, p.responses]), area: true }], { format: n, bucket: d.bucket }))}
        ${card('Thời gian', lineChart([
          { name: 'Trả lời xong (TB)', points: series.filter((p) => p.avg_ms !== null).map((p) => [p.t, p.avg_ms]) },
          { name: 'Ra chữ đầu tiên (TB)', points: series.filter((p) => p.avg_ttft !== null).map((p) => [p.t, p.avg_ttft]), color: 'var(--violet)' },
        ], { format: ms, bucket: d.bucket }))}
        ${card('Token theo thời gian', lineChart([{ name: 'Token', points: series.map((p) => [p.t, p.tokens || 0]), area: true, color: 'var(--green)' }], { format: tok, bucket: d.bucket }))}
        ${card('Theo nguồn', bars(d.by_source.map((s, i) => ({ label: `${SOURCE[s.source] || s.source} · ${n(s.calls)} lần`, value: s.tokens, color: COLORS[i % COLORS.length] })), { format: tok }), 'token')}
      </div>
      ${card('Lỗi gần đây', errorTable(d.errors), 'gọi model, function, tracker, tải tài liệu')}`;
  }

  let traceQuery = '', traceMin = 0, traceSource = '', traceId = (location.hash.match(/^#trace-(.+)$/) || [])[1] || '';
  async function renderTrace() {
    const params = new URLSearchParams({ range, q: traceQuery, min_ms: String(traceMin) });
    if (traceSource) params.set('source', traceSource);
    const list = await api(`/api/traces?${params}`);
    if (!traceId && list.items.length) traceId = list.items[0].message_id;
    let detail = '';
    if (traceId) {
      try { detail = traceDetail(await api(`/api/trace/${encodeURIComponent(traceId)}`)); }
      catch (e) { detail = card('Chi tiết', `<div class="error-box">${esc(e.message)}</div>`); }
    }
    const mins = [[0, 'Tất cả'], [10000, '> 10 s'], [30000, '> 30 s'], [60000, '> 1 phút']];
    const sources = [['', 'Mọi nguồn'], ['chat', 'Chat'], ['channel', 'Kênh'], ['api', 'API']];
    return `<div class="controls">
        <input id="trace-q" class="btn" style="min-width:260px" placeholder="Tìm message id, chat id, người dùng, model…" value="${esc(traceQuery)}">
        <div class="seg" role="group" aria-label="Thời gian tối thiểu">${mins.map(([v, l]) => `<button type="button" data-trace-min="${v}" aria-pressed="${traceMin === v}">${l}</button>`).join('')}</div>
        <div class="seg" role="group" aria-label="Nguồn">${sources.map(([v, l]) => `<button type="button" data-trace-source="${v}" aria-pressed="${traceSource === v}">${l}</button>`).join('')}</div>
      </div>
      ${detail}
      ${card('Các lượt trả lời', table([
        { label: 'Lúc', render: (r) => when(r.ts) },
        { label: 'Người dùng', render: (r) => esc(r.user_name || '—') },
        { label: 'Message id', render: (r) => `<code style="font-size:11.5px">${esc(r.message_id || '—')}</code>` },
        { label: 'Model', render: (r) => esc(r.model_id || '—') },
        { label: 'Nguồn', render: (r) => SOURCE[r.source] || esc(r.source) },
        { label: 'Gọi LLM', num: true, render: (r) => n(r.llm_calls) },
        { label: 'Tool call', num: true, render: (r) => n(r.tool_calls) },
        { label: 'Chữ đầu', num: true, render: (r) => ms(r.first_ttft) },
        { label: 'Tổng', num: true, render: (r) => `<b>${ms(r.duration_ms)}</b>` },
        { label: '', render: (r) => (r.status === 'ok' ? '' : '<span class="pill err">lỗi</span>') },
      ], list.items, 'Không có lượt nào khớp.', traceAttr), 'bấm một dòng để xem timeline')}`;
  }

  function traceDetail(t) {
    const total = Math.max(t.total_ms, 1);
    const sm = t.summary;
    const pos = (start, dur) => `left:${Math.max(0, ((start - t.start) / total) * 100)}%;width:${Math.max(0.3, ((dur || 0) / total) * 100)}%`;
    const rows = [];
    if (sm.prepare_ms > 0) rows.push({ n: '', label: 'Chuẩn bị', sub: 'đọc lịch sử, file/kiến thức, dựng prompt', bar: `<div class="wf-bar prep" style="${pos(t.start, sm.prepare_ms)}"></div>`, dur: sm.prepare_ms });
    let llmRound = 0;
    t.steps.forEach((e, i) => {
      if (e.kind === 'llm_call') {
        llmRound += 1;
        const m = e.meta || {};
        const ttftPct = e.ttft_ms && e.duration_ms ? (e.ttft_ms / e.duration_ms) * 100 : 0;
        rows.push({
          n: i + 1,
          label: `LLM vòng ${llmRound}`,
          sub: `${esc(e.model_id || '')} · chờ chữ đầu ${ms(e.ttft_ms)} · ${n(e.input_tokens)}→${n(e.output_tokens)} token${m.tokens_per_second ? ` · ${n(m.tokens_per_second)} t/s` : ''}${m.error ? ` · <span style="color:var(--red)">${esc(m.error)}</span>` : ''}`,
          bar: `<div class="wf-bar ${e.status === 'ok' ? 'llm' : 'err'}" style="${pos(e.ts, e.duration_ms)}" title="Phần gạch chéo: thời gian chờ chữ đầu tiên"><span class="ttft" style="width:${ttftPct}%"></span></div>`,
          dur: e.duration_ms,
        });
      } else {
        const m = e.meta || {};
        rows.push({
          n: i + 1,
          label: `<code>${esc(e.name)}</code>`,
          sub: e.status === 'ok' ? 'function call' : `<span style="color:var(--red)">lỗi: ${esc(m.error || m.error_type || '')}</span>`,
          bar: `<div class="wf-bar ${e.status === 'ok' ? 'tool' : 'err'}" style="${pos(e.ts, e.duration_ms)}"></div>`,
          dur: e.duration_ms,
        });
      }
    });
    (t.tasks || []).forEach((e) => rows.push({ n: '', label: `<span class="muted">Tác vụ nền: ${esc(e.name || '')}</span>`, sub: esc(e.model_id || ''), bar: `<div class="wf-bar task" style="${pos(e.ts, e.duration_ms)}"></div>`, dur: e.duration_ms }));
    const parts = [
      ['Chuẩn bị', sm.prepare_ms, 'var(--faint)'], ['LLM', sm.llm_ms, 'var(--violet)'], ['Tool', sm.tool_ms, 'var(--blue)'], ['Khác (NCS AI xử lý giữa các bước)', sm.other_ms, 'var(--amber)'],
    ];
    const slowest = [...t.steps].sort((a, b) => (b.duration_ms || 0) - (a.duration_ms || 0))[0];
    const axis = [0, 0.25, 0.5, 0.75, 1].map((f) => `<span>${ms(total * f)}</span>`).join('');
    return card(`Timeline lượt trả lời ${t.status && t.status !== 'ok' ? '<span class="pill err">lỗi</span>' : ''}`, `
      <div class="ids muted" style="font-size:12.5px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px 14px">
        <span>${esc(t.user_name || '—')} ${t.email ? `(${esc(t.email)})` : ''}</span>
        <span>${when(t.start)}</span>
        <span>Model: <b>${esc(t.model_id || '—')}</b></span>
        <span>${SOURCE[t.source] || esc(t.source || '')}</span>
        <span>message id: <code data-copy="${esc(t.message_id)}" title="Bấm để sao chép">${esc(t.message_id)}</code></span>
        ${t.chat_id ? `<span>chat id: <code data-copy="${esc(t.chat_id)}" title="Bấm để sao chép">${esc(t.chat_id)}</code></span>` : ''}
        ${t.link ? `<a href="${esc(t.link)}" target="_blank" rel="noopener">Mở cuộc chat →</a>` : ''}
      </div>
      <div id="reveal-box">${revealBox(t.message_id)}</div>
      <div class="grid" style="margin:14px 0 10px">
        ${kpi('Tổng thời gian', ms(t.total_ms), `${n(sm.llm_calls)} lần gọi LLM · ${n(sm.tool_calls)} tool call`)}
        ${kpi('Thời gian LLM', ms(sm.llm_ms), `trong đó chờ chữ đầu ${ms(sm.ttft_ms)}`)}
        ${kpi('Thời gian tool', ms(sm.tool_ms), '')}
        ${kpi('Token vào / ra', `${tok(sm.input_tokens)} / ${tok(sm.output_tokens)}`, 'cộng các vòng gọi LLM')}
      </div>
      <div class="split" title="Phân bổ thời gian">${parts.map(([l, v, c]) => `<span style="width:${((v || 0) / total) * 100}%;background:${c}" title="${l}: ${ms(v)}"></span>`).join('')}</div>
      <div class="legend" style="margin-bottom:12px">${parts.map(([l, v, c]) => `<span><i style="background:${c}"></i>${l} ${ms(v)} (${pct(v || 0, total)})</span>`).join('')}</div>
      ${slowest ? `<div class="notice info" style="margin-bottom:12px">Bước lâu nhất: <b>${slowest.kind === 'llm_call' ? 'gọi LLM' : esc(slowest.name)}</b> mất ${ms(slowest.duration_ms)} (${pct(slowest.duration_ms || 0, total)} tổng thời gian)${slowest.kind === 'llm_call' && slowest.ttft_ms > (slowest.duration_ms || 0) * 0.5 ? ', phần lớn là chờ model bắt đầu trả lời (prompt dài hoặc GPU đang bận)' : ''}.</div>` : ''}
      <div class="wf-axis"><div></div><div></div><div>${axis}</div><div></div></div>
      <div class="wf">${rows.map((r) => `<div class="wf-row"><div class="wf-n">${r.n}</div><div class="wf-label"><b>${r.label}</b><span>${r.sub}</span></div><div class="wf-track">${r.bar}</div><div class="wf-dur">${ms(r.dur)}</div></div>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--faint)"></i>Chuẩn bị</span><span><i style="background:var(--violet)"></i>Gọi LLM (gạch chéo: chờ chữ đầu)</span><span><i style="background:var(--blue)"></i>Function call</span><span><i style="background:var(--red)"></i>Lỗi</span><span><i style="background:var(--line-strong)"></i>Tác vụ nền (tiêu đề, gợi ý…)</span></div>
    `);
  }

  // Message content is fetched on request only, kept in memory for this page view, never stored.
  let revealed = { id: '', question: '', answer: '' };
  let revealError = '';
  function revealBox(id) {
    if (revealed.id === id) {
      return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px"><span class="muted" style="font-size:12px">Câu hỏi của người dùng</span><button class="btn" type="button" data-hide-content>Ẩn nội dung</button></div>
        <div class="qbox">${esc(revealed.question || '(không tìm thấy: cuộc chat tạm, đã xóa hoặc gọi qua API)')}</div>
        <div class="muted" style="font-size:12px;margin:10px 0 4px">Câu trả lời</div>
        <div class="qbox">${esc(revealed.answer || '(không có)')}</div>`;
    }
    return `<form id="reveal-form" data-id="${esc(id)}" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
        <span class="muted" style="font-size:12.5px">Nội dung câu hỏi và câu trả lời đang được ẩn.</span>
        <input id="reveal-key" class="btn" type="password" autocomplete="off" placeholder="Nhập khóa truy xuất" style="min-width:220px">
        <button class="btn primary" type="submit">Truy xuất nội dung</button>
        ${revealError ? `<span class="error-box">${esc(revealError)}</span>` : ''}
      </form>`;
  }
  document.addEventListener('submit', async (e) => {
    if (e.target.id !== 'reveal-form') return;
    e.preventDefault();
    const id = e.target.dataset.id;
    const key = $('#reveal-key').value;
    if (!key) return;
    try {
      const data = await api(`/api/trace/${encodeURIComponent(id)}/content`, { method: 'POST', headers: { 'X-Reveal-Key': key } });
      revealed = { id, ...data };
      revealError = '';
    } catch (err) {
      revealError = err.message;
    }
    const box = $('#reveal-box');
    if (box) box.innerHTML = revealBox(id);
  });

  // ---------- settings editor (admin key + Google Authenticator code) ----------
  const editor = { open: false, token: '', expires: 0, data: null, status: null, error: '', note: '' };
  const editHeaders = () => ({ 'X-Edit-Token': editor.token, 'Content-Type': 'application/json' });
  async function openEditor() {
    editor.open = true; editor.error = ''; editor.note = '';
    try { editor.status = await api('/api/admin/status', { headers: editHeaders() }); } catch (e) { editor.error = e.message; }
    if (editor.token && editor.status && editor.status.session_expires) await loadSettings();
    drawEditor();
    watchReindex();
  }
  async function loadSettings() {
    try {
      editor.data = await api('/api/admin/settings', { headers: editHeaders() });
      editor.expires = editor.data.expires;
      editor.reindex = await api('/api/admin/reindex', { headers: editHeaders() }).catch(() => null);
      const c = await api('/api/admin/connections', { headers: editHeaders() });
      editor.connections = c.connections.map((x) => ({ ...x, key: '', test: null }));
    }
    catch (e) { editor.token = ''; editor.data = null; editor.error = e.message; }
  }
  function drawEditor() { const el = $('#editor'); if (el) el.innerHTML = editorHtml(); const b = document.querySelector('[data-open-editor]'); if (b) b.textContent = editor.open ? 'Đóng chỉnh sửa' : 'Chỉnh sửa cấu hình'; }
  function fieldHtml(f) {
    const id = `cfg-${f.key.replace(/[^a-z0-9]/gi, '-')}`;
    const help = f.help ? `<small>${esc(f.help)}</small>` : '';
    if (f.type === 'bool') return `<div class="field"><label class="check"><input type="checkbox" id="${id}" data-key="${esc(f.key)}" data-type="bool" ${f.value === true || f.value === 'true' ? 'checked' : ''}> ${esc(f.label)}</label>${help}</div>`;
    if (f.type === 'select') return `<div class="field"><label for="${id}">${esc(f.label)}</label><select id="${id}" data-key="${esc(f.key)}" data-type="select">${f.options.map(([v, l]) => `<option value="${esc(v)}" ${String(f.value ?? '') === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>${help}</div>`;
    if (f.type === 'secret') return `<div class="field"><label for="${id}">${esc(f.label)}</label><input type="password" id="${id}" data-key="${esc(f.key)}" data-type="secret" autocomplete="new-password" placeholder="${f.value && f.value.set ? 'Đã đặt · để trống = giữ nguyên' : 'Chưa đặt'}">${help}</div>`;
    if (f.type === 'int') return `<div class="field"><label for="${id}">${esc(f.label)}</label><input type="number" id="${id}" data-key="${esc(f.key)}" data-type="int" value="${esc(f.value ?? '')}" ${f.min !== undefined ? `min="${f.min}"` : ''} ${f.max !== undefined ? `max="${f.max}"` : ''}>${help}</div>`;
    return `<div class="field"><label for="${id}">${esc(f.label)}</label><input type="text" id="${id}" data-key="${esc(f.key)}" data-type="text" value="${esc(f.value ?? '')}">${help}</div>`;
  }
  function editorHtml() {
    if (!editor.open) return '';
    const st = editor.status || {};
    const msg = editor.error ? `<div class="error-box" style="margin-top:8px">${esc(editor.error)}</div>` : '';
    const ok = editor.note ? `<div class="notice info" style="margin-top:8px">${esc(editor.note)}</div>` : '';
    if (!st.admin_key_set) return card('Chỉnh sửa cấu hình', `<div class="notice warn">Chưa đặt <code>MONITOR_REVEAL_KEY</code> trong <code>.env</code> của server nên không thể sửa cấu hình. Đặt khóa rồi chạy <code>docker compose up -d monitor</code>.</div>${msg}`);
    if (!st.totp_set) return card('Chỉnh sửa cấu hình', `<div class="notice warn">Chưa cài mã Google Authenticator. Trên server chạy lệnh dưới, quét QR in ra trong terminal (QR và secret không bao giờ hiện trên trang này):<br><code>docker compose exec monitor python -m open_webui.monitoring.server.totp init</code></div>${msg}`);
    if (!editor.token || !editor.data) {
      return card('Chỉnh sửa cấu hình', `<form id="unlock-form" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
          <span class="muted" style="font-size:12.5px">Nhập khóa truy xuất (MONITOR_REVEAL_KEY) và mã 6 số trên Google Authenticator. Mỗi mã chỉ dùng một lần; phiên chỉnh sửa kéo dài 15 phút.</span>
          <input id="unlock-key" class="btn" type="password" autocomplete="off" placeholder="Khóa truy xuất" style="min-width:220px">
          <input id="unlock-code" class="btn" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Mã 6 số" style="width:110px;letter-spacing:.2em">
          <button class="btn primary" type="submit">Xác thực</button>
        </form>${msg}`);
    }
    const d = editor.data;
    const left = Math.max(0, editor.expires - Math.floor(Date.now() / 1000));
    const groups = d.groups.map((g) => `<section class="card" style="box-shadow:none"><h2>${esc(g.label)} <button class="btn primary" type="button" data-save-group="${esc(g.key)}">Lưu</button></h2>${g.note ? `<p class="muted" style="font-size:12px;margin:-4px 0 10px">${esc(g.note)}</p>` : ''}<div data-group="${esc(g.key)}">${d.settings.filter((f) => f.group === g.key).map(fieldHtml).join('')}</div></section>`).join('');
    const history = table([
      { label: 'Lúc', render: (r) => when(r.ts) },
      { label: 'Cấu hình', render: (r) => `<b>${esc((r.meta || {}).label || r.name)}</b><div class="muted" style="font-size:11px">${esc(r.name)}</div>` },
      { label: 'Cũ', render: (r) => `<code>${esc(JSON.stringify((r.meta || {}).old ?? null))}</code>` },
      { label: 'Mới', render: (r) => `<code>${esc(JSON.stringify((r.meta || {}).new ?? null))}</code>` },
      { label: 'Từ máy', render: (r) => esc((r.meta || {}).client || '') },
    ], d.history || [], 'Chưa có thay đổi nào.');
    return card('Chỉnh sửa cấu hình', `<div class="lockbar"><span class="muted" style="font-size:12.5px">Phiên chỉnh sửa còn <b id="edit-left">${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</b>. Lưu xong, NCS AI áp dụng trong tối đa 15 giây, không cần khởi động lại.</span><button class="btn" type="button" data-lock>Khóa lại</button></div>${ok}${msg}
      ${connectionsHtml()}
      <div class="editor-groups" style="margin-top:12px">${groups}</div>
      <div id="reindex-box">${reindexHtml()}</div>
      <h2 style="margin-top:14px">Lịch sử thay đổi</h2>${history}`);
  }
  const REINDEX_STEP = { starting: 'đang bắt đầu', knowledge_files: 'tạo lại vector cho file trong kho kiến thức', knowledge_search: 'tạo lại chỉ mục tìm kho kiến thức', memories: 'tạo lại vector bộ nhớ' };
  function reindexHtml() {
    const r = editor.reindex || {};
    let status = '<span class="muted">Chưa chạy lần nào từ trang này.</span>';
    if (r.state === 'running') {
      const pctDone = r.files_total ? Math.min(100, Math.round((r.files_done / r.files_total) * 100)) : 0;
      status = `<span class="spin"></span> Đang chạy: ${esc(REINDEX_STEP[r.step] || r.step || '')} · ${n(r.files_done)}/${n(r.files_total)} file (${pctDone}%) · bắt đầu ${when(r.started_at * 1000)}
        <div class="meter" style="margin-top:6px"><div style="width:${pctDone}%"></div></div>`;
    } else if (r.state === 'done') {
      status = `<span class="pill ok">Xong</span> lúc ${when(r.finished_at * 1000)} · ${n(r.files_done)} file · mất ${ms((r.finished_at - r.started_at) * 1000)}`;
    } else if (r.state === 'failed') {

  let reindexPoll = null;
  function watchReindex() {
    clearInterval(reindexPoll);

    reindexPoll = setInterval(async () => {
      if (!editor.token) { clearInterval(reindexPoll); return; }
      try { editor.reindex = await api('/api/admin/reindex', { headers: editHeaders() }); } catch { return; }
      const box = $('#reindex-box'); if (box) box.innerHTML = reindexHtml();
      if (editor.reindex.state !== 'running') clearInterval(reindexPoll);
    }, 3000);
  }

  function connectionsHtml() {

        <div><input type="text" data-conn-field="prefix_id" value="${esc(c.prefix_id)}" placeholder="Prefix (tùy chọn)" title="Prefix ID: thêm vào trước tên model. Giữ nguyên prefix khi đổi URL để model và quyền truy cập không đổi."></div>

      </div>`).join('');

      <p class="muted" style="font-size:12px;margin:-4px 0 6px">URL kết thúc bằng <code>/v1</code>. Ô khóa để trống = giữ khóa cũ. Bấm <b>Kiểm tra</b> để thử URL và khóa trước khi lưu. Lưu xong, NCS AI nạp lại danh sách model trong tối đa 15 giây. Muốn model cũ (và quyền truy cập, lịch sử) giữ nguyên tên thì giữ nguyên Prefix khi đổi URL.</p>

  document.addEventListener('input', (e) => {
    const field = e.target.dataset?.connField;

  });
  document.addEventListener('change', (e) => {
    if (e.target.dataset?.connField === 'enable') editor.connections[+e.target.closest('[data-conn]').dataset.conn].enable = e.target.checked;
  });
  async function connectionAction(b) {
    const list = editor.connections;
    if (b.dataset.connAdd !== undefined) { list.push({ index: null, url: '', key: '', key_set: false, enable: true, prefix_id: '', test: null }); }
    else if (b.dataset.connUp !== undefined) { const i = +b.dataset.connUp; [list[i - 1], list[i]] = [list[i], list[i - 1]]; }
    else if (b.dataset.connRemove !== undefined) {
      const i = +b.dataset.connRemove;
      if (list[i].index !== null && !confirm(`Xóa kết nối #${i + 1} (${list[i].url})? Các model của kết nối này sẽ không dùng được nữa sau khi lưu.`)) return;
      list.splice(i, 1);
    } else if (b.dataset.connTest !== undefined) {
      const c = list[+b.dataset.connTest];
      c.test = { pending: true }; drawEditor();
      try { c.test = await api('/api/admin/connections/test', { method: 'POST', headers: editHeaders(), body: JSON.stringify({ url: c.url, key: c.key, index: c.key ? null : c.index }) }); }
      catch (err) { c.test = { ok: false, error: err.message }; }
    } else if (b.dataset.connSave !== undefined) {
      if (!confirm('Lưu thay đổi kết nối model? NCS AI sẽ dùng ngay URL và khóa mới.')) return;
      try {
        const res = await api('/api/admin/connections', { method: 'POST', headers: editHeaders(), body: JSON.stringify({ connections: list.map((c) => ({ index: c.index, url: c.url, key: c.key, enable: c.enable, prefix_id: c.prefix_id })) }) });

        await loadSettings();
      } catch (err) { editor.error = err.message; if (/hết hạn/.test(err.message)) { editor.token = ''; editor.data = null; } }
    }
    drawEditor();
  }

  async function saveGroup(group) {
    const box = document.querySelector(`[data-group="${group}"]`);
    const changes = {};
    box.querySelectorAll('[data-key]').forEach((el) => {
      const t = el.dataset.type;
      if (t === 'bool') changes[el.dataset.key] = el.checked;
      else if (t === 'secret') { if (el.value) changes[el.dataset.key] = el.value; }
      else if (t === 'int') changes[el.dataset.key] = el.value === '' ? null : Number(el.value);
      else changes[el.dataset.key] = el.value;
    });
    for (const k of Object.keys(changes)) if (changes[k] === null) delete changes[k];
    try {
      const res = await api('/api/admin/settings', { method: 'POST', headers: editHeaders(), body: JSON.stringify({ changes }) });
      editor.error = '';
      editor.note = res.changed.length ? `Đã lưu ${res.changed.length} thay đổi. NCS AI sẽ áp dụng trong tối đa 15 giây.` : 'Không có gì thay đổi.';
      await loadSettings();
    } catch (e) { editor.error = e.message; if (/hết hạn/.test(e.message)) { editor.token = ''; editor.data = null; } }
    drawEditor();
  }
  document.addEventListener('submit', async (e) => {
    if (e.target.id !== 'unlock-form') return;
    e.preventDefault();
    try {
      const res = await api('/api/admin/unlock', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ admin_key: $('#unlock-key').value, code: $('#unlock-code').value }) });
      editor.token = res.token; editor.expires = res.expires; editor.error = '';

    } catch (err) { editor.error = err.message; }

  });

    const el = $('#edit-left');

    const left = Math.max(0, editor.expires - Math.floor(Date.now() / 1000));
    el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
    if (!left) { editor.token = ''; editor.data = null; editor.error = 'Phiên chỉnh sửa đã hết hạn.'; drawEditor(); }
  }, 1000);

      <p class="muted" style="margin:0;font-size:12.5px">Cách đọc: nếu thời gian ra chữ đầu tiên và tổng thời gian tăng mạnh khi số yêu cầu đồng thời tăng, điểm nghẽn nằm ở model/GPU (cần thêm GPU, tăng <code>--max-num-seqs</code> của vLLM hoặc thêm pod). Nếu số đồng thời thấp mà vẫn chậm, xem tab Function call và Thành phần & tài nguyên (CPU/RAM container).</p>`;

  async function renderTokens() {
    const d = await api(`/api/tokens?range=${range}${tokenSource ? `&source=${tokenSource}` : ''}`);
    const users = {};
    for (const r of d.matrix) {
      const u = (users[r.user_id || '—'] ||= { name: r.user_name, email: r.email, input: 0, output: 0, calls: 0, models: [] });
      u.input += r.input_tokens; u.output += r.output_tokens; u.calls += r.calls; u.models.push(r);
    }
    const list = Object.values(users).sort((a, b) => b.input + b.output - (a.input + a.output));
    const filters = [['', 'Tất cả'], ['chat', 'Chat'], ['channel', 'Kênh'], ['task', 'Tác vụ nền'], ['tracker', 'Tracker'], ['api', 'API']];
    return `${d.calls_without_usage ? `<div class="notice warn">${n(d.calls_without_usage)} lần gọi model không có số token (model/provider không trả về <code>usage</code>), nên tổng token có thể thấp hơn thực tế.</div>` : ''}

  function knowledgeFlow(s) {
    const bypass = !!s['rag.bypass_embedding_and_retrieval'];
    const engine = s['rag.content_extraction_engine'] || '';
    const extractor = engine ? engine : 'thư viện có sẵn (pypdf cho PDF, python-docx cho Word, unstructured/pandas cho Excel, PowerPoint)';
    const emb = `${s['rag.embedding_engine'] || 'sentence-transformers (chạy ngay trong container NCS AI, CPU)'} · ${s['rag.embedding_model'] || '—'}`;
    const steps = [
      [true, '1. Tải file lên', `Lưu file gốc vào kho lưu trữ (RustFS/S3). Giới hạn ${n(s['rag.file.max_size'])} MB/file.`],
      [true, '2. Trích xuất văn bản', `Công cụ: ${esc(extractor)}. Toàn bộ chữ được lưu vào cơ sở dữ liệu (cột nội dung của file).`],
      [!bypass, '3. Chia đoạn', `Bộ chia ${esc(s['rag.text_splitter'] || 'character')}, mỗi đoạn ${n(s['rag.chunk_size'])} ký tự, chồng lấn ${n(s['rag.chunk_overlap'])}.`],
      [!bypass, '4. Tạo embedding & lưu vector', `Model ${esc(emb)} → lưu vào ${esc((window.__infra || {}).vector_db || 'vector DB')}.`],
      [true, '5. Khi người dùng hỏi', bypass
        ? 'AI tự gọi công cụ đọc kiến thức: liệt kê file, tìm theo tên, tìm dòng chứa từ khóa (grep), đọc từng phần file (view_file). Không có tìm kiếm theo ngữ nghĩa.'
        : `Câu hỏi được tạo embedding → tìm ${n(s['rag.top_k'])} đoạn gần nhất${s['rag.enable_hybrid_search'] ? ` kết hợp BM25, rerank bằng ${esc(s['rag.reranking_model'] || '—')}` : ''} → đưa vào prompt.`],
    ];
    return `<div class="flow">${steps.map(([on, t, d]) => `<div class="step${on ? '' : ' off'}"><b>${t}</b><span>${d}</span></div>`).join('')}</div>`;
  }

        ${kpi('Kênh đang theo dõi', n(ch.channels), `${n(ch.running)} đang tổng hợp`)}

      ['Tìm kiếm web', s['web.search.enable'] ? esc(s['web.search.engine'] || 'chưa chọn') : 'Tắt', 'API', null],
      ['Tool server (OpenAPI / MCP)', (st.tool_servers || []).map((t) => `${esc(t.name)} <span class="muted">${esc(t.type)} · ${esc(t.url)}</span>${t.enabled ? '' : ' <span class="pill">tắt</span>'}`).join('<br>') || 'Không có', 'Dịch vụ ngoài', null],
      ['Tạo ảnh', s['image_generation.enable'] ? `${esc(s['image_generation.engine'])} · ${esc(s['image_generation.model'] || '')}` : 'Tắt', 'API', null],
      ['Chạy code (Code interpreter)', s['code_interpreter.enable'] ? esc(s['code_interpreter.engine']) : 'Tắt', 'Trình duyệt / Jupyter', null],
      ['Terminal (tạo file Word/Excel/PDF)', (st.terminals || []).map((t) => `${esc(t.name)} (${esc(t.url)}) ${t.enabled ? '' : '· tắt'}`).join('<br>') || 'Chưa cấu hình', 'Container riêng', null],
      ['Cơ sở dữ liệu', esc((st.infra || {}).database || '—'), 'Container postgres', null],
      ['Vector DB', esc((st.infra || {}).vector_db || '—'), 'Trong PostgreSQL (pgvector)', null],
      ['Lưu file', esc((st.infra || {}).storage || '—'), 'Container RustFS', null],
      ['Redis (đồng bộ nhiều worker, websocket)', (st.infra || {}).redis ? 'Bật' : 'Tắt', 'Container redis', null],
    ];
    const docker = d.docker || {};
    const containers = (docker.containers || []).sort((a, b) => b.memory - a.memory);
    const maxMem = Math.max(...containers.map((x) => x.memory), 1);
    const db = d.database || {};
    const redis = d.redis || {};
    const pr = probeResult;
    return `${st.error ? `<div class="notice warn">Không lấy được trạng thái từ NCS AI: ${esc(st.error)}</div>` : ''}
      <div id="editor">${editorHtml()}</div>
      ${card(`Thành phần đang dùng <button class="btn" type="button" data-open-editor>${editor.open ? 'Đóng chỉnh sửa' : 'Chỉnh sửa cấu hình'}</button>`, table([
        { label: 'Thành phần', render: (r) => `<b>${r[0]}</b>` },
        { label: 'Đang dùng', render: (r) => r[1] },
        { label: 'Chạy ở đâu', render: (r) => `<span class="muted">${r[2]}</span>` },
        { label: 'Nạp RAM', render: (r) => (r[3] === null ? '' : r[3] ? '<span class="pill info">đã nạp</span>' : '<span class="pill">chưa</span>') },
      ], components))}
      <div class="cols">
        ${card('Container: RAM và CPU', docker.available ? table([
          { label: 'Container', render: (r) => `<b>${esc(r.name)}</b><div class="muted">${esc(r.image)}</div>` },
          { label: 'RAM', render: (r) => `<div style="display:flex;gap:8px;align-items:center"><div class="meter" style="flex:1"><div style="width:${(r.memory / maxMem) * 100}%"></div></div><span class="num">${bytes(r.memory)}</span></div>` },
          { label: 'CPU', num: true, render: (r) => `${r.cpu_percent.toLocaleString('vi-VN')}%` },
          { label: 'Trạng thái', render: (r) => `<span class="pill ${r.state === 'running' ? 'ok' : 'err'}">${esc(r.status)}</span>` },
        ], containers) : `<div class="notice warn">${esc(docker.reason || 'Không có dữ liệu Docker')}. Hiện chỉ có số liệu của container NCS AI bên dưới.</div>`, `máy chủ: ${bytes(c.host_memory_total)} RAM, ${n(c.cpu_count)} CPU`)}
        ${card('Container NCS AI', `<dl class="kv">
          <dt>RAM đang dùng</dt><dd>${bytes((c.memory || {}).used)}${(c.memory || {}).limit ? ` / giới hạn ${bytes(c.memory.limit)}` : ''}</dd>
          <dt>Tổng RAM các tiến trình</dt><dd>${bytes(c.rss)} (${n(c.processes)} tiến trình, ${n((st.infra || {}).workers)} worker)</dd>

          <dt>Redis</dt><dd>${redis.error ? esc(redis.error) : `${bytes(redis.memory)} · ${n(redis.clients)} client · ping ${ms(redis.ping_ms)}`}</dd>

      </div>

        <button class="btn primary" type="button" id="probe">Đo ngay</button> <button class="btn" type="button" id="probe-lite">Đo nhanh (không gọi model)</button>
        <div id="probe-out" style="margin-top:12px">${pr ? probeTable(pr) : ''}</div>`)}`;
  }

  function probeTable(pr) {
    if (pr.error) return `<div class="error-box">${esc(pr.error)}</div>`;
    const rows = Object.entries(pr.results || {}).map(([name, r]) => ({ name, ...r }));
    return table([
      { label: 'Thành phần', render: (r) => `<b>${esc(r.name)}</b>` },
      { label: 'Kết quả', render: (r) => (r.ok ? '<span class="pill ok">OK</span>' : `<span class="pill err">Lỗi</span> <span class="muted">${esc(r.error)}</span>`) },
      { label: 'Thời gian', num: true, render: (r) => ms(r.ms) },
      { label: 'Chi tiết', render: (r) => {
        const det = r.detail;
        if (!det || typeof det !== 'object') return `<span class="muted">${esc(det || '')}</span>`;
        if (det.completion) { const cp = det.completion; return `danh sách model ${ms(det.models_ms)} · <b>${esc(cp.model)}</b>: ra chữ đầu ${ms(cp.ttft_ms)}, xong ${ms(cp.total_ms)}, ${n(cp.output_tokens)} token, <b>${cp.tokens_per_second ?? '—'} token/s</b>`; }
        if (det.models) return `danh sách model ${ms(det.models_ms)} · ${esc(det.models.slice(0, 6).join(', '))}`;
        if (det.dimensions) return `vector ${n(det.dimensions)} chiều`;
        return esc(JSON.stringify(det));
      } },
    ], rows);
  }

  const RENDER = { trace: renderTrace, overview: renderOverview, load: renderLoad, tokens: renderTokens, models: renderModels, tools: renderTools, knowledge: renderKnowledge, tracker: renderTracker, system: renderSystem };

  async function load() {
    const main = $('#main');
    try {
      const html = await RENDER[tab]();
      main.innerHTML = html;
      $('#updated').textContent = `cập nhật ${new Date().toLocaleTimeString('vi-VN')}`;
      $('#live-dot').style.background = 'var(--green)';
    } catch (e) {
      main.innerHTML = `<div class="card error-box">Không tải được dữ liệu: ${esc(e.message)}</div>`;
      $('#live-dot').style.background = 'var(--red)';
    }
  }

  function renderChrome() {
    $('#tabs').innerHTML = TABS.map(([k, l]) => `<button role="tab" type="button" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join('');
    $('#ranges').innerHTML = RANGES.map(([k, l]) => `<button type="button" data-range="${k}" aria-pressed="${range === k}">${l}</button>`).join('');
    const theme = document.documentElement.getAttribute('data-theme') || '';
    $('#themes').innerHTML = [['', 'Tự động'], ['light', 'Sáng'], ['dark', 'Tối']].map(([k, l]) => `<button type="button" data-theme="${k}" aria-pressed="${theme === k}">${l}</button>`).join('');
  }

  function schedule() {
    clearInterval(timer);
    // Skip a refresh while the viewer is typing (search, reveal key), so the input is not wiped.
    if ($('#auto').checked) timer = setInterval(() => document.visibilityState === 'visible' && !document.activeElement?.matches('input, select') && !(tab === 'system' && editor.open) && load(), 30000);
  }

  document.addEventListener('input', (e) => {
    if (e.target.id === 'trace-q') { clearTimeout(window.__tq); window.__tq = setTimeout(() => { traceQuery = e.target.value; traceId = ''; load().then(() => { const el = $('#trace-q'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }); }, 400); }
  });
  document.addEventListener('click', async (e) => {
    const copy = e.target.closest('[data-copy]');
    if (copy) { try { await navigator.clipboard.writeText(copy.dataset.copy); copy.title = 'Đã sao chép'; } catch {} return; }
    const row = e.target.closest('tr[data-trace]');
    if (row && !e.target.closest('a')) { revealed = { id: '', question: '', answer: '' }; revealError = ''; traceId = row.dataset.trace; tab = 'trace'; history.replaceState(null, '', `#trace-${traceId}`); renderChrome(); load(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.openEditor !== undefined) { if (editor.open) { editor.open = false; drawEditor(); } else { await openEditor(); } return; }
    if (b.dataset.saveGroup) { await saveGroup(b.dataset.saveGroup); return; }
    if (b.dataset.reindex !== undefined) {
      if (!confirm('Lập chỉ mục lại toàn bộ vector kiến thức và bộ nhớ bằng model embedding hiện tại? Việc này có thể mất từ vài phút đến hàng giờ và gọi model embedding cho mọi file.')) return;
      try { editor.reindex = await api('/api/admin/reindex', { method: 'POST', headers: editHeaders() }); editor.error = ''; editor.note = editor.reindex.already_running ? 'Đang có một lần lập chỉ mục lại chạy, theo dõi tiến độ bên dưới.' : 'Đã bắt đầu lập chỉ mục lại.'; }
      catch (err) { editor.error = err.message; }
      drawEditor(); watchReindex(); return;
    }
    if (b.dataset.connAdd !== undefined || b.dataset.connUp !== undefined || b.dataset.connRemove !== undefined || b.dataset.connTest !== undefined || b.dataset.connSave !== undefined) { await connectionAction(b); return; }
    if (b.dataset.lock !== undefined) { try { await api('/api/admin/lock', { method: 'POST', headers: editHeaders() }); } catch {} editor.token = ''; editor.data = null; editor.note = ''; drawEditor(); return; }
    if (b.dataset.hideContent !== undefined) { const id = revealed.id; revealed = { id: '', question: '', answer: '' }; const box = $('#reveal-box'); if (box) box.innerHTML = revealBox(id); return; }
    if (b.dataset.traceMin !== undefined) { traceMin = +b.dataset.traceMin; traceId = ''; load(); return; }
    if (b.dataset.traceSource !== undefined) { traceSource = b.dataset.traceSource; traceId = ''; load(); return; }
    if (b.dataset.tab) { tab = b.dataset.tab; store('mon.tab', tab); history.replaceState(null, '', `#${tab}`); renderChrome(); $('#main').innerHTML = '<div class="empty"><span class="spin"></span> Đang tải…</div>'; load(); }
    else if (b.dataset.range) { range = b.dataset.range; store('mon.range', range); renderChrome(); load(); }
    else if (b.dataset.theme !== undefined) { const t = b.dataset.theme; if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); store('mon.theme', t); renderChrome(); }
    else if (b.dataset.source !== undefined) { tokenSource = b.dataset.source; load(); }
    else if (b.dataset.tool !== undefined) { toolFilter = b.dataset.tool; load(); }
    else if (b.id === 'refresh') load();
    else if (b.id === 'probe' || b.id === 'probe-lite') {
      const out = $('#probe-out');
      out.innerHTML = '<span class="spin"></span> Đang đo… (có thể mất đến 1 phút)';
      document.querySelectorAll('#probe, #probe-lite').forEach((x) => (x.disabled = true));
      try { probeResult = await api(`/api/probe?llm=${b.id === 'probe'}`, { method: 'POST' }); }
      catch (err) { probeResult = { error: err.message }; }
      out.innerHTML = probeTable(probeResult);
      document.querySelectorAll('#probe, #probe-lite').forEach((x) => (x.disabled = false));
    }
  });
  $('#auto').addEventListener('change', schedule);

  const savedTheme = store('mon.theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  renderChrome();
  load();
  schedule();
})();
</script>
</body>
</html>
